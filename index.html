// ---------- handlers ----------
async function socialAction(fn, args, doneMsg){
  try{ await rpc(fn, args); if(doneMsg) socialToast(doneMsg); }
  catch(e){ socialToast(socialErr(e)); }
  await loadSocial();
  if(social.query.trim().length>=3) runSearch();
}
function attachSocialButtons(root){
  root.querySelectorAll("[data-friend-add]").forEach(b=>{ b.onclick = ()=>{ b.disabled = true; socialAction("send_friend_request", { p_user:b.dataset.friendAdd }, "Friend request sent."); }; });
  root.querySelectorAll("[data-friend-accept]").forEach(b=>{ b.onclick = ()=>{ b.disabled = true; socialAction("respond_friend_request", { p_user:b.dataset.friendAccept, p_accept:true }, "You're now friends."); }; });
  root.querySelectorAll("[data-friend-decline]").forEach(b=>{ b.onclick = ()=>socialAction("respond_friend_request", { p_user:b.dataset.friendDecline, p_accept:false }); });
  root.querySelectorAll("[data-friend-remove]").forEach(b=>{ b.onclick = ()=>{ if(b.dataset.confirm && !confirm(b.dataset.confirm)) return; socialAction("remove_friend", { p_user:b.dataset.friendRemove }); }; });
}
function attachSocialHandlers(){
  const fb = document.getElementById("friendsBtn");
  if(fb) fb.onclick = ()=>{ state.backTo = state.screen; state.screen = "friends"; social.error = ""; render(); window.scrollTo(0,0); loadSocial(); };
  if(state.screen==="friends"){
    const lb = document.getElementById("shopLoginBtn"); if(lb) lb.onclick = ()=>showAuth("login");
    document.querySelectorAll("[data-social-tab]").forEach(b=>{ b.onclick = ()=>{ social.tab = b.dataset.socialTab; render(); }; });
    const box = document.getElementById("friendSearch");
    if(box) box.oninput = ()=>{ social.query = box.value; clearTimeout(socialSearchTimer); socialSearchTimer = setTimeout(runSearch, 500); };
    attachSocialButtons(document.getElementById("app"));
    document.querySelectorAll("[data-invite-accept]").forEach(b=>{ b.onclick = ()=>socialAction("respond_group_invite", { p_group:b.dataset.inviteAccept, p_accept:true }, "You've joined the group."); });
    document.querySelectorAll("[data-invite-decline]").forEach(b=>{ b.onclick = ()=>socialAction("respond_group_invite", { p_group:b.dataset.inviteDecline, p_accept:false }); });
    document.querySelectorAll("[data-open-group]").forEach(b=>{ b.onclick = ()=>openGroup(b.dataset.openGroup); });
    document.querySelectorAll("[data-open-thread]").forEach(b=>{ b.onclick = ()=>openThread(b.dataset.openThread, b.dataset.threadName); });
    const cg = document.getElementById("createGroupBtn");
    if(cg) cg.onclick = async ()=>{
      const name = document.getElementById("newGroupName").value.trim();
      if(!name) return socialToast("Give the group a name first.");
      cg.disabled = true;
      try{ const id = await rpc("create_group", { p_name:name }); await loadSocial(); openGroup(id); }
      catch(e){ cg.disabled = false; socialToast(socialErr(e)); }
    };
  }
  if(state.screen!=="group"){ stopChatPolling(); return; }
  const back = document.getElementById("groupBackBtn");
  if(back) back.onclick = ()=>{ stopChatPolling(); state.screen = "friends"; social.tab = "groups"; social.group = null; render(); loadSocial(); };
  document.querySelectorAll("[data-group-tab]").forEach(b=>{ b.onclick = ()=>{ social.gtab = b.dataset.groupTab; social.error = ""; render(); loadGroupTab(); }; });
  if(social.gtab==="chat"){
    updateChatList(true);
    const input = document.getElementById("chatInput");
    if(input){
      input.oninput = ()=>{ social.draft = input.value; };
      input.onkeydown = (e)=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); } };
    }
    const send = document.getElementById("chatSendBtn"); if(send) send.onclick = sendMessage;
    startChatPolling();
  }else stopChatPolling();
  const sd = document.getElementById("shareDeckBtn"); if(sd) sd.onclick = shareDeck;
  const sq = document.getElementById("shareQBtn"); if(sq) sq.onclick = shareQuestion;
  document.querySelectorAll("[data-share-save]").forEach(b=>{ b.onclick = ()=>{
    const sh = social.shares.find(x=>x.id===Number(b.dataset.shareSave)); if(!sh) return;
    stopChatPolling();
    openSharedItem({ item_key: user && sh.user_id===user.id ? null : "g"+sh.id, source: user && sh.user_id===user.id ? "sent" : "group",
      from_user:sh.username, group_name:social.group.name, kind:sh.kind, title:sh.title, payload:sh.payload, created_at:sh.created_at }, "group");
  }; });
  document.querySelectorAll("[data-share-del]").forEach(b=>{ b.onclick = ()=>deleteShare(Number(b.dataset.shareDel)); });
  document.querySelectorAll("[data-group-invite]").forEach(b=>{ b.onclick = async ()=>{
    b.disabled = true;
    try{ await rpc("invite_to_group", { p_group:social.group.id, p_user:b.dataset.groupInvite }); socialToast("Invite sent."); }
    catch(e){ socialToast(socialErr(e)); }
    social.members = await rpc("group_member_list", { p_group:social.group.id }).catch(()=>social.members) || social.members; render();
  }; });
  document.querySelectorAll("[data-member-remove]").forEach(b=>{ b.onclick = async ()=>{
    if(!confirm("Remove this person from the group?")) return;
    try{ await rpc("remove_member", { p_group:social.group.id, p_user:b.dataset.memberRemove }); }
    catch(e){ socialToast(socialErr(e)); }
    social.members = await rpc("group_member_list", { p_group:social.group.id }).catch(()=>social.members) || social.members; render();
  }; });
  const leave = document.getElementById("leaveGroupBtn");
  if(leave) leave.onclick = async ()=>{
    const msg = social.group.role==="owner" ? "Leave this group? Ownership passes to the longest-standing member, or the group is deleted if you're the only one left." : "Leave this group?";
    if(!confirm(msg)) return;
    try{ await rpc("leave_group", { p_group:social.group.id }); stopChatPolling(); social.group = null; state.screen = "friends"; social.tab = "groups"; await loadSocial(); render(); }
    catch(e){ socialToast(socialErr(e)); }
  };
}

// "Shared with me" lists decks and questions sent to you by friends or shared in your groups.
// "Messages" holds one-to-one chats with friends; a message can carry a deck or question.
const INBOX_SEEN_KEY = "alevel_maths_inbox_seen_v1";
const inbox = { tab:"shared", items:[], convos:[], loaded:false, error:"", unreadDM:0,
                thread:null, tmsgs:[], tdraft:"", view:null, viewFrom:"inbox" };
let threadPoll = null, inboxPoll = null;

function seenKeys(){ const s = loadJSON(INBOX_SEEN_KEY, null); return new Set(s && user && s.uid===user.id ? s.keys : []); }
function markSeen(keys){
  if(!user) return;
  const set = seenKeys(); keys.forEach(k=>set.add(k));
  try{ localStorage.setItem(INBOX_SEEN_KEY, JSON.stringify({ uid:user.id, keys:[...set].slice(-600) })); }catch(e){}
}

// ---------- saving shared things ----------
function payloadQuestionCount(kind, p){ return kind==="deck" ? ((p && p.questionIds) || []).length : 1; }
function saveSharedThing(kind, title, p){
  p = p || {};
  if(kind==="deck"){
    const added = importCustom(p.custom);
    const decks = loadDecks();
    const id = "deck" + Date.now() + Math.random().toString(36).slice(2,6);
    decks.push({ id, name:String(p.name||title||"Shared deck").slice(0,60), questionIds:(p.questionIds||[]).map(String) });
    saveDecksL(decks);
    return { deckId:id, added };
  }
  return { added: importCustom([p]) };
}
function practiseIds(ids, origin){
  const pool = ids.map(qid=>findQuestionById(qid)).filter(q=>q && !getQState(q.id).suspended);
  if(!pool.length){ alert("None of these questions can be practised right now."); return; }
  stopThreadPolling();
  state.queue = shuffleArr(pool); state.screen = "practice"; state.lastAnswered = null;
  state.practiceOrigin = origin || "decks"; state.session = { possibleMarks:0, earnedPoints:0, answered:0 };
  nextQuestion(); render(); window.scrollTo(0,0);
}
// Work out what each question in a shared deck is, for the preview.
function describeSharedQuestion(qid, p){
  const own = (p.custom||[]).find(c=>c && c.question && c.question.id===qid);
  if(own) return { topic:own.topic, prompt:own.question.prompt, marks:own.question.marks||1, subject:own.subject };
  const q = findQuestionById(qid);
  if(q) return { topic:q.topic, prompt:q.prompt, marks:q.marks||1, subject:subjectOf(q) };
  return null;
}

// ---------- one-to-one chat ----------
function openThread(uid, name){
  inbox.thread = { user_id:uid, username:name }; inbox.tmsgs = []; inbox.tdraft = "";
  stopChatPolling();
  state.screen = "thread"; render(); window.scrollTo(0,0);
  fetchThread(true).then(()=>loadInbox());
  startThreadPolling();
}
async function fetchThread(full){
  const t = inbox.thread; if(!t) return;
  const last = inbox.tmsgs.length ? inbox.tmsgs[inbox.tmsgs.length-1].id : null;
  try{
    const rows = await rpc("get_direct", { p_user:t.user_id, p_after: full ? null : last });
    if(full) inbox.tmsgs = rows||[];
    else if(rows && rows.length){ const seen = new Set(inbox.tmsgs.map(m=>m.id)); inbox.tmsgs.push(...rows.filter(m=>!seen.has(m.id))); }
    else return;
    updateThreadList(true);
  }catch(e){ inbox.error = socialErr(e); if(state.screen==="thread") render(); }
}
function threadListHtml(){
  if(!inbox.tmsgs.length) return `<div class="sub" style="text-align:center;margin:20px 0;">No messages yet. Say hello, or send a deck below.</div>`;
  return inbox.tmsgs.map((m,i)=>{
    const card = m.share_kind ? `<button class="share-bubble" data-thread-share="${i}">
        <span aria-hidden="true">${m.share_kind==="deck" ? "📚" : "❓"}</span>
        <span><strong>${esc(m.share_title||"")}</strong><br><span>${m.share_kind==="deck" ? `Deck · ${payloadQuestionCount("deck", m.payload)} questions` : "Question"} · View ›</span></span>
      </button>` : "";
    return `<div class="chat-msg${m.from_me?" mine":""}">
      <div class="chat-meta">${m.from_me ? "You" : "@"+esc(inbox.thread.username||"")} · ${fmtWhen(m.created_at)}${m.from_me ? ` <button class="chat-del" data-dm-del="${m.id}">Delete</button>` : ` <button class="chat-del" data-report-kind="direct_message" data-report-target="${m.id}" data-report-label="a message from @${esc(inbox.thread.username||"someone")}">Report</button>`}</div>
      ${m.body ? `<div class="chat-body">${esc(m.body)}</div>` : ""}${card}
    </div>`;
  }).join("");
}
function updateThreadList(scroll){
  const el = document.getElementById("chatList"); if(!el || state.screen!=="thread") return;
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  el.innerHTML = threadListHtml();
  el.querySelectorAll("[data-dm-del]").forEach(b=>{ b.onclick = async ()=>{
    if(!confirm("Delete this message? It disappears for both of you.")) return;
    try{ await rpc("delete_direct", { p_id:Number(b.dataset.dmDel) }); inbox.tmsgs = inbox.tmsgs.filter(m=>m.id!==Number(b.dataset.dmDel)); updateThreadList(false); }
    catch(e){ socialToast(socialErr(e)); }
  }; });
  el.querySelectorAll("[data-thread-share]").forEach(b=>{ b.onclick = ()=>{
    const m = inbox.tmsgs[Number(b.dataset.threadShare)];
    openSharedItem({ item_key: m.from_me ? null : "d"+m.id, source: m.from_me ? "sent" : "direct", from_user: inbox.thread.username,
                     kind:m.share_kind, title:m.share_title, payload:m.payload, created_at:m.created_at }, "thread");
  }; });
  if(scroll || nearBottom) el.scrollTop = el.scrollHeight;
}
async function sendDirect(kind, title, payload){
  const box = document.getElementById("chatInput");
  const body = box ? box.value.trim() : "";
  if(!body && !kind) return;
  if(inbox.busy) return; inbox.busy = true;
  try{
    await rpc("send_direct", { p_to:inbox.thread.user_id, p_body: kind ? "" : body, p_kind:kind||null, p_title:title||null, p_payload:payload||null });
    if(!kind && box){ box.value = ""; inbox.tdraft = ""; }
    await fetchThread(false); updateThreadList(true);
    if(kind) socialToast(kind==="deck" ? "Deck sent." : "Question sent.");
  }catch(e){ socialToast(/pg_column_size|check constraint/i.test(e.message||"") ? "That's too big to send (its pictures take up too much space)." : socialErr(e)); }
  inbox.busy = false;
}

  return `<div class="toprow"><h2>@${esc(t.username||"")}</h2><button class="link-btn" id="threadBackBtn">Back</button></div>

}
function stopThreadPolling(){ if(threadPoll){ clearInterval(threadPoll); threadPoll = null; } }

function attachInboxHandlers(){
  if(state.screen!=="thread") stopThreadPolling();
  if(state.screen==="inbox"){
    const lb = document.getElementById("shopLoginBtn"); if(lb) lb.onclick = ()=>showAuth("login");
    document.querySelectorAll("[data-inbox-tab]").forEach(b=>{ b.onclick = ()=>{ inbox.tab = b.dataset.inboxTab; render(); }; });
    document.querySelectorAll("[data-inbox-item]").forEach(b=>{ b.onclick = ()=>openSharedItem({...inbox.items[Number(b.dataset.inboxItem)]}, "inbox"); });
    document.querySelectorAll("[data-open-thread]").forEach(b=>{ b.onclick = ()=>openThread(b.dataset.openThread, b.dataset.threadName); });
    const ma = document.getElementById("markAllSeenBtn"); if(ma) ma.onclick = ()=>{ markSeen(inbox.items.map(i=>i.item_key)); render(); };
    const gf = document.getElementById("goFriendsBtn"); if(gf) gf.onclick = ()=>goTab("friends");
  }
  if(state.screen==="sharedItem"){
    const it = inbox.view;
    const back = document.getElementById("sharedBackBtn");
    if(back) back.onclick = ()=>{
      if(inbox.viewFrom==="thread" && inbox.thread){ state.screen = "thread"; render(); fetchThread(false); startThreadPolling(); }
      else if(inbox.viewFrom==="group" && social.group){ state.screen = "group"; render(); loadGroupTab(); }
      else { state.screen = "inbox"; render(); }
    };
    const save = document.getElementById("sharedSaveBtn");
    if(save) save.onclick = ()=>{
      const r = saveSharedThing(it.kind, it.title, it.payload);
      if(it.kind==="deck"){ state.viewDeckId = r.deckId; state.backTo = "inbox"; state.screen = "decks"; render(); window.scrollTo(0,0); socialToast(`Saved “${it.title}” to your decks.`); }
      else socialToast(r.added ? "Added to your questions. Find it in Manage for its subject." : "You already have this question.");
    };
    const pr = document.getElementById("sharedPractiseBtn");
    if(pr) pr.onclick = ()=>{
      saveSharedThing(it.kind, it.title, it.payload);
      const ids = it.kind==="deck" ? (it.payload.questionIds||[]).map(String) : [String(it.payload.question && it.payload.question.id)];
      practiseIds(ids, "decks");
    };
  }
  if(state.screen==="thread"){
    startThreadPolling();
    updateThreadList(true);
    const back = document.getElementById("threadBackBtn");
    if(back) back.onclick = ()=>{ stopThreadPolling(); inbox.tab = "messages"; state.screen = "inbox"; render(); loadInbox(); };
    const input = document.getElementById("chatInput");
    if(input){ input.oninput = ()=>{ inbox.tdraft = input.value; }; input.onkeydown = (e)=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendDirect(); } }; }
    const send = document.getElementById("chatSendBtn"); if(send) send.onclick = ()=>sendDirect();
    const db = document.getElementById("dmDeckBtn");
    if(db) db.onclick = ()=>{
      const d = loadDecks().find(x=>x.id===document.getElementById("dmDeckSelect").value); if(!d) return;
      const idx = customQuestionIndex();
      sendDirect("deck", d.name, { name:d.name, questionIds:d.questionIds.slice(0,500), custom:d.questionIds.filter(id=>idx[id]).map(id=>idx[id]) });
    };
    const qb = document.getElementById("dmQBtn");
    if(qb) qb.onclick = ()=>{
      const it = customQuestionIndex()[document.getElementById("dmQSelect").value]; if(!it) return;
      sendDirect("question", snipPlain(it.question.prompt, 80), it);
    };
  }
}

// ---------- reporting ----------
let reportCtx = null;
function openReport(kind, target, label){
  if(!user) return;
  reportCtx = { kind, target:String(target), label:label||"this", returnTo:state.screen };
  state.screen = "report"; render(); window.scrollTo(0,0);
}
function renderReport(){
  const r = reportCtx; if(!r) return `<div class="sub">Nothing to report.</div>`;
  return `<div class="toprow"><h2>Report ${esc(r.label)}</h2><button class="link-btn" id="reportBackBtn">Cancel</button></div>
    <div class="card">
      <div class="sub" style="margin:0 0 10px;">Reports go to the site owner, not to the person you're reporting. We'll look at it and remove anything that breaks the rules.</div>
      <label class="field" for="safetyReason">What's wrong?</label>
      <select id="safetyReason">${REPORT_REASONS.map(x=>`<option>${esc(x)}</option>`).join("")}</select>
      <label class="field" for="safetyDetails">Anything else we should know? (optional)</label>
      <textarea id="safetyDetails" maxlength="1000" rows="3"></textarea>
      <button class="btn-primary" id="safetySendBtn" style="margin-top:6px;">Send report</button>
    </div>
    ${HELP_BOX}
    <div class="sub" style="margin-top:10px;">You can also block people so they can't send you decks or add you as a friend.</div>`;
}
function leaveReport(){
  const back = reportCtx ? reportCtx.returnTo : "home";
  state.screen = back; render();
  if(back==="thread") fetchThread(false);
  if(back==="group") loadGroupTab();
}
async function sendReport(btn){
  btn.disabled = true;
  try{
    await rpc("report_content", { p_kind:reportCtx.kind, p_target:reportCtx.target,
      p_reason:document.getElementById("safetyReason").value, p_details:document.getElementById("safetyDetails").value });
    leaveReport();
    socialToast("Thanks. Your report has been sent and will be reviewed.");
  }catch(e){ btn.disabled = false; socialToast(socialErr(e).replace("social-and-coins-setup.sql", "safety-and-privacy-setup.sql")); }
}
async function blockUser(uid, name){
  if(!confirm(`Block @${name}?\n\nThey won't be able to send you decks, friend requests or group invites, and you'll stop being friends. They won't be told. You can unblock them from your Account page.`)) return;
  try{ await rpc("block_user", { p_user:uid }); }
  catch(e){ socialToast(socialErr(e).replace("social-and-coins-setup.sql", "safety-and-privacy-setup.sql")); return; }
  await loadSocial(); loadInbox();
  if(state.screen==="thread"){ stopThreadPolling(); inbox.tab = "messages"; state.screen = "inbox"; }
  if(state.screen==="group"){ social.messages = []; loadGroupTab(); }
  render();
  socialToast(`You've blocked @${name}.`);
}

async function downloadMyData(btn){
  btn.disabled = true; btn.textContent = "Preparing…";
  try{
    const server = await rpc("export_my_data");
    const bundle = { about:"Everything " + SITE_NAME + " stores about your account.", from_our_server:server,
      on_this_device:{ decks:loadDecks(), questions_you_wrote:loadCustom(), theme:loadShop().active } };
    const blob = new Blob([JSON.stringify(bundle, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `my-data-${(user.username||"account")}-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  }catch(e){ socialToast(socialErr(e).replace("social-and-coins-setup.sql", "safety-and-privacy-setup.sql")); }
  btn.disabled = false; btn.textContent = "Download my data";
}
async function deleteMyAccount(){
  const name = user.username || "";
  const typed = prompt(`This permanently deletes your account and everything in it.\n\nTo confirm, type your username: ${name}`);
  if(typed===null) return;
  if(typed.trim().toLowerCase()!==name.toLowerCase()){ alert("That didn't match your username, so nothing was deleted."); return; }
  try{ await rpc("delete_my_account"); }
  catch(e){ alert("Your account couldn't be deleted: " + socialErr(e)); return; }
  try{ await sb.auth.signOut(); }catch(e){}
  clearLocalData(); localStorage.removeItem(GUEST_KEY);
  alert("Your account has been deleted.");
  location.reload();
}

// so they're handled with one listener.

// ======================= QUESTION TABLES =======================
// A question can include a table. Write it as text, one row per line, cells separated by "|".
// A cell in [square brackets] is a blank the student fills in; on GCSE pages each one gets its own
// answer box. Put alternative answers inside the brackets separated by "//", e.g. [3/4 // 0.75].
// [] on its own is a blank with nothing to fill in.
//   "table": "x | -2 | -1 | 0 | 1 | 2\ny | 6 | [3] | 2 | [3] | 6"
// The first row is shown as headings. The first column is shown as headings too when it's words
// (like x / y). You can also give an object:
//   "table": { "rows": [["Score","Frequency"],["1","[4]"]], "headerRow": true, "headerColumn": false }
function parseCell(v){
  if(v && typeof v==="object"){
    const answers = acceptedList(v);
    return { blank:true, answers, exact:v.exact };
  }
  const s = String(v==null ? "" : v).trim();
  const m = s.match(/^\[(.*)\]$/s);
  if(m) return { blank:true, answers:m[1].split("//").map(x=>x.trim()).filter(Boolean) };
  return { text:s };
}
function parseTable(t){
  if(!t) return null;
  let rows, headerRow = true, headerCol = null;
  if(typeof t==="string"){
    rows = t.split(/\r?\n/).filter(l=>l.trim()).map(l=>{
      let line = l.trim();
      if(line.startsWith("|") && line.endsWith("|") && line.length>1) line = line.slice(1, -1);   // | a | b | style
      return line.split("|").map(parseCell);
    });
  } else if(Array.isArray(t.rows)){
    rows = t.rows.map(r=>(Array.isArray(r) ? r : []).map(parseCell));
    if(t.headerRow===false) headerRow = false;
    if(typeof t.headerColumn==="boolean") headerCol = t.headerColumn;
  } else return null;
  rows = rows.filter(r=>r.length);
  if(!rows.length) return null;
  if(headerCol===null){
    const body = rows.slice(headerRow ? 1 : 0);
    headerCol = body.length>0 && body.every(r=>r[0] && !r[0].blank && r[0].text!=="" && toNumber(r[0].text)===null && !/^\$/.test(r[0].text));
  }
  return { rows, headerRow, headerCol };
}
function tableToText(t){
  if(!t) return "";
  if(typeof t==="string") return t;
  const p = parseTable(t); if(!p) return "";
  return p.rows.map(r=>r.map(c=>c.blank ? `[${c.answers.join(" // ")}]` : c.text).join(" | ")).join("\n");
}
// The answer parts that come from blank table cells (each has .r and .c).
function tableParts(q){
  const t = parseTable(q && q.table); if(!t) return [];
  const out = [];
  t.rows.forEach((row, r)=>row.forEach((cell, c)=>{
    if(!cell.blank || !cell.answers.length) return;
    const colHead = t.headerRow && r>0 && t.rows[0][c] && !t.rows[0][c].blank ? t.rows[0][c].text : "";
    const rowHead = t.headerCol && c>0 && row[0] && !row[0].blank ? row[0].text : "";
    const label = [rowHead, colHead].filter(Boolean).join(", ") || `row ${r+1}, column ${c+1}`;
    out.push({ label, answers:cell.answers, exact:!!(cell.exact ?? q.exact), tolerance:q.tolerance, fraction:false, kind:"", table:true, r, c });
  }));
  return out;
}
// mode: "display" (blanks empty), "answers" (blanks show the answer), "input" (answer boxes).
function tableHtml(q, mode){
  const t = parseTable(q && q.table); if(!t) return "";
  const spec = mode==="input" ? (answerSpec(q)||[]) : [];
  const idxAt = {}; spec.forEach((p,i)=>{ if(p.table) idxAt[p.r+","+p.c] = i; });
  const a = state.ans || {ok:{}, drafts:{}, bad:{}};
  const cellHtml = (cell, r, c)=>{
    const isHead = (t.headerRow && r===0) || (t.headerCol && c===0);
    const tag = isHead ? "th" : "td";
    const scope = isHead ? (r===0 && t.headerRow ? ` scope="col"` : ` scope="row"`) : "";
    if(!cell.blank) return `<${tag}${scope}>${esc(cell.text)}</${tag}>`;
    if(mode==="answers") return `<${tag} class="cell-answer">${esc(cell.answers[0]||"")}</${tag}>`;
    if(mode!=="input" || idxAt[r+","+c]===undefined) return `<${tag} class="cell-blank"></${tag}>`;
    const i = idxAt[r+","+c], p = spec[i];
    if(a.result){
      if(a.ok[i]) return `<td class="cell-ok">${esc(a.drafts[i]||p.answers[0])} <span aria-label="correct">✓</span></td>`;
      return `<td class="cell-revealed" title="Correct answer">${esc(p.answers[0])}</td>`;
    }
    if(a.ok[i]) return `<td class="cell-ok">${esc(a.drafts[i]||"")} <span aria-label="correct">✓</span></td>`;
    return `<td class="cell-input"><input type="text" class="ans-input cell-in${a.bad && a.bad[i] ? " bad" : ""}" data-ans="${i}" value="${esc(typeof a.drafts[i]==="string" ? a.drafts[i] : "")}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer for ${esc(p.label)}"></td>`;
  };
  return `<div class="qtable-wrap"><table class="qtable">${t.rows.map((row, r)=>`<tr>${row.map((cell, c)=>cellHtml(cell, r, c)).join("")}</tr>`).join("")}</table></div>`;
}

// ======================= GCSE: TYPED ANSWERS =======================
// On GCSE pages, a question with an answer shows an answer box instead of "Show solution".
// The solution appears once the answer is right, or after MAX_TRIES wrong tries.
// Wrong tries cost nothing, except that running out of tries (the last wrong try) costs 1 point. Questions without an answer use the old
// "Show solution" + self-marking.
// Question fields (in the subject's JSON file):
//   "answer": "12"                          one accepted answer, or
//   "answers": ["3/4", "0.75"]              several accepted answers
//   "parts": [ {"label":"a", "answers":["12"]}, {"label":"b", "answer":"3/4", "exact":true} ]
//   "exact": true      must match the text (no "6/8 = 3/4" equivalence), e.g. "simplest form"
//   "tolerance": 0.01  how close a number has to be (default: essentially exact)
// Answers that are fractions ("3/4", "-2/5", "1 3/4") get separate numerator/denominator boxes
// (plus a whole-number box for mixed numbers). Add "fraction": false to use a normal box instead.
// Powers can be written as x^2 or x² and standard form as 3.2x10^4 or 3.2×10⁴.
//   "roots": ["-5", "2"]    one "x =" box per solution (e.g. a quadratic), accepted in any order.
//   "variable": "y"         changes the label from "x =" (optional)
//   "ordered": true         a list answer must be in the given order (e.g. "write in order of size")
//   A part can have "prefix": "x =" to label its box "x =" instead of "(a)".
const MAX_TRIES = 5;
const SUP = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻","−":"⁻","+":"⁺","(":"⁽",")":"⁾","=":"⁼",
  "n":"ⁿ","x":"ˣ","y":"ʸ","a":"ᵃ","b":"ᵇ","c":"ᶜ","d":"ᵈ","e":"ᵉ","k":"ᵏ","m":"ᵐ","p":"ᵖ","t":"ᵗ"};
const SUP_BACK = Object.fromEntries(Object.entries(SUP).filter(([k])=>k!=="−").map(([k,v])=>[v,k]));
const SUP_RUN = new RegExp("[" + Object.values(SUP).join("") + "]+", "g");
// Turns common LaTeX into plain text so answers like "$\\pounds 95$", "$270\\text{ mm}$" or "$3\\tfrac{5}{12}$" can be checked.
function texClean(s){
  return String(s||"")
    .replace(/\$/g,"")
    .replace(/\\(?:text|mathrm|textbf|mathbf|operatorname)\s*\{([^{}]*)\}/g,"$1")
    .replace(/\\pounds\s*/g,"£").replace(/\\degree|\^\{?\\circ\}?|\\circ/g,"°")
    .replace(/\\[dt]?frac/g,"\\frac")
    .replace(/(\d)\s*\\frac\{(\d+)\}\{(\d+)\}/g,"$1 $2/$3")          // 3\frac{5}{12} -> 3 5/12
    .replace(/\\(?:quad|qquad|,|;|:|!| )/g," ")
    .replace(/\\%/g,"%")
    .replace(/\\left|\\right/g,"");
}
function supToCaret(s){ return String(s||"").replace(SUP_RUN, run=>"^" + [...run].map(c=>SUP_BACK[c]||"").join("")); }

function fractionKind(p){
  if(p.fraction===false) return "";
  const first = texClean(String(p.answers[0]||"")).trim().replace(/[−–—]/g,"-");
  const tex = first.match(/^(-?)\\frac\{(\d+)\}\{(\d+)\}$/);
  if(tex || /^-?\d+\s*\/\s*\d+$/.test(first) || p.fraction===true) return "fraction";
  if(/^-?\d+\s+\d+\s*\/\s*\d+$/.test(first)) return "mixed";
  return "";
}
function answerSpec(q){
  if(!q) return null;
  let parts = [];
  if(Array.isArray(q.parts) && q.parts.length) parts = q.parts.map((p,i)=>({ label:p.label || String.fromCharCode(97+i), prefix:p.prefix, answers:acceptedList(p), exact:!!(p.exact ?? q.exact), ordered:!!(p.ordered ?? q.ordered), tolerance:p.tolerance ?? q.tolerance, fraction:p.fraction ?? q.fraction }));
  else {
    const list = acceptedList(q);
    if(list.length) parts = [{ label:"", answers:list, exact:!!q.exact, ordered:!!q.ordered, tolerance:q.tolerance, fraction:q.fraction }];
  }
  parts.forEach(p=>{ p.kind = fractionKind(p); });
  // "roots": ["-5", "2"] -> one "x =" box per solution; they can be typed in either order.
  const roots = Array.isArray(q.roots) ? q.roots.map(String).filter(x=>x.trim()) : [];
  if(roots.length){
    const v = String(q.variable || "x");
    parts = roots.map((r,i)=>({ label:"", prefix:`${v} =`, answers:roots, display:r, group:"roots", exact:!!q.exact, tolerance:q.tolerance, fraction:false, kind:"" })).concat(parts);
  }
  const cells = tableParts(q);
  if(cells.length && parts.length===1 && !parts[0].label) parts[0].label = "answer";
  const all = [...cells, ...parts].filter(p=>p.answers.length);
  all.forEach(p=>{ if(p.display===undefined) p.display = p.answers[0]; });
  return all.length ? all : null;
}
function acceptedList(o){
  const out = [];
  if(Array.isArray(o.answers)) out.push(...o.answers);
  if(o.answer!==undefined && o.answer!==null && o.answer!=="") out.push(o.answer);
  return out.map(String).filter(s=>s.trim()!=="");
}
function usesTypedAnswer(q){ return !!(q && isGcse(subjectOf(q)) && answerSpec(q)); }

// ---- answer checking ----
function normAns(raw){
  let s = supToCaret(texClean(raw)).toLowerCase().trim();
  s = s.replace(/\$/g,"").replace(/\\left|\\right|\\,|\\;|\\!|\\ /g,"");
  s = s.replace(/\\sqrt\{([^{}]*)\}/g,"√($1)").replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,"($1)/($2)");
  s = s.replace(/\\times|×/g,"*").replace(/\\div|÷/g,"/").replace(/\\pi/g,"π").replace(/\\%/g,"%").replace(/\\cdot/g,"*").replace(/[{}]/g,"").replace(/\\/g,"");
  s = s.replace(/[−–—]/g,"-");
  s = s.replace(/\s+(and|or)\s+/g,",").replace(/;/g,",");
  s = s.replace(/square\s*root\s*(of)?|sqrt|root/g,"√").replace(/\bpi\b/g,"π");
  s = s.replace(/\s+/g,"");
  s = s.replace(/√\(([^()]*)\)/g,"√$1");
  s = s.replace(/\^\((-?[\w.]+)\)/g,"^$1");                  // x^(2) -> x^2
  s = s.replace(/^\((-?\d+)\)\/\((\d+)\)$/,"$1/$2");          // (3)/(4) -> 3/4
  s = s.replace(/\((-?[a-z0-9.]+)\)/g,"$1");                  // (4) -> 4, (y) -> y
  s = s.replace(/(\d),(?=\d{3}(?!\d))/g,"$1");                 // 1,000 -> 1000
  s = s.replace(/\.$/,"");
  return s;
}
function stripVar(s){ return s.replace(/^[a-z]=(?=.)/,""); }  // "x=3" -> "3"
function toNumber(raw){
  let t = supToCaret(texClean(raw)).trim().toLowerCase().replace(/[−–—]/g,"-").replace(/^[a-z]\s*=\s*/,"").replace(/^£\s*/,"").replace(/,(?=\d{3}(?!\d))/g,"");
  t = t.replace(/\$/g,"").replace(/\\times|×|\\cdot/g,"*").replace(/[{}]/g,"").replace(/\\frac(\d+)(\d+)$/,"$1/$2");
  let m = t.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);                       // mixed number 1 3/4
  if(m){ const w = +m[1], f = +m[2]/+m[3]; return (w<0 || m[1]==="-0") ? w - f : w + f; }
  t = t.replace(/\s+/g,"");
  m = t.match(/^(-?\d*\.?\d+)(?:\*|x)10\^(-?\d+)$/);                       // standard form 3.2x10^4
  if(m) return +m[1] * Math.pow(10, +m[2]);
  m = t.match(/^(-?\d*\.?\d+)\^(-?\d*\.?\d+)$/);                           // power 2^5
  if(m) return Math.pow(+m[1], +m[2]);
  t = t.replace(/(%|°|pence|p|[a-z]+(\^-?\d+)?)$/,"");                     // trailing units (cm, cm^2, %, °)
  m = t.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);                          // fraction
  if(m){ const d = +m[2]; return d===0 ? null : +m[1]/d; }
  m = t.match(/^-?\d*\.?\d+(e-?\d+)?$/);
  return m ? +t : null;
}
function sameValue(input, expected, part){
  const a = stripVar(normAns(input)), b = stripVar(normAns(expected));
  if(a===b) return true;
  if(part.exact) return false;
  const x = toNumber(input), y = toNumber(expected);
  if(x===null || y===null) return false;
  const tol = part.tolerance!==undefined ? Math.abs(+part.tolerance) : 1e-9 * Math.max(1, Math.abs(y));
  return Math.abs(x - y) <= tol + 1e-12;
}
function listItems(s){ return normAns(s).split(",").filter(Boolean); }
function checkPart(input, part){
  if(!String(input||"").trim()) return false;
  if(part.ordered && !/[,;]/.test(input)) input = String(input).trim().split(/\s+/).join(", ");   // "−7 −3 0 4 6"
  return part.answers.some(acc=>{
    const n = normAns(acc);
    if(n.includes(",") && !/[()\[\]]/.test(n)){                               // a list like "2, -3": any order
      const want = listItems(acc), got = listItems(input);
      if(want.length!==got.length) return false;
      if(part.ordered) return want.every((w,i)=>sameValue(got[i], w, part));    // "write in order" questions
      const used = new Set();
      return want.every(w=>{ const i = got.findIndex((g,j)=>!used.has(j) && sameValue(g, w, part)); if(i<0) return false; used.add(i); return true; });
    }
    return sameValue(input, acc, part);
  });
}
// What the student typed for part i, as one string ("3/4", "1 3/4" or free text).
function partInput(i, p){
  const d = state.ans.drafts[i];
  if(!p.kind) return typeof d==="string" ? d : "";
  const o = (d && typeof d==="object") ? d : {};
  const n = String(o.n||"").trim(), den = String(o.d||"").trim(), w = String(o.w||"").trim();
  if(!n && !den && !w) return "";
  if(p.kind==="mixed") return `${w||"0"} ${n}/${den}`;
  return `${n}/${den}`;
}
function partFilled(i, p){
  if(!p.kind) return !!partInput(i, p).trim();
  const o = state.ans.drafts[i] || {};
  return !!(String(o.n||"").trim() && String(o.d||"").trim() && (p.kind!=="mixed" || String(o.w||"").trim()));
}

// ---- state for the current card ----
function resetAnswerState(){ state.ans = { tries:0, drafts:{}, ok:{}, sup:{}, bad:{}, result:null, feedback:"", attempt:null }; }
function prettyAnswer(s){
  const str = String(s);
  const m = str.trim().match(/^(-?\d+\s+)?(-?\d+)\s*\/\s*(\d+)$/);
  if(m) return `${m[1] ? esc(m[1].trim()) + " " : ""}<span class="frac-show"><span>${esc(m[2])}</span><span>${esc(m[3])}</span></span>`;
  return esc(str.replace(/\^\(?(-?[0-9a-z+]+)\)?/gi, (x, e)=>[...e].map(c=>SUP[c]||c).join("")));
}
function answerInputHtml(p, i, a){
  const ok = a.ok[i], dis = ok ? "disabled" : "";
  const partName = p.label ? `part ${esc(p.label)}` : "your answer";
  if(p.kind){
    const o = a.drafts[i] || {};
    const box = (f, ph, lab)=>`<input type="text" inputmode="numeric" class="ans-input frac-in${ok?" ok":""}" data-ans="${i}" data-field="${f}" value="${esc(o[f]||"")}" ${dis} autocomplete="off" placeholder="${ph}" aria-label="${lab} for ${partName}">`;
    return `<div class="frac-wrap">
      ${p.kind==="mixed" ? box("w","","Whole number") : ""}
      <span class="frac-stack">${box("n","","Numerator")}<span class="frac-bar" aria-hidden="true"></span>${box("d","","Denominator")}</span>
    </div>`;
  }
  const supOn = !!a.sup[i];
  return `<input type="text" id="ans${i}" class="ans-input${ok?" ok":""}" data-ans="${i}" value="${esc(typeof a.drafts[i]==="string" ? a.drafts[i] : "")}" ${dis} autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${p.group ? "" : p.label ? "Answer to part "+esc(p.label) : "Your answer"}" aria-label="${p.group ? `Solution ${i+1}: ${esc(p.prefix||"")}` : p.label ? "Answer to part "+esc(p.label) : "Your answer"}">
    ${ok ? "" : `<span class="ans-tools">
      <button type="button" class="ans-tool" data-insert-sqrt="${i}" aria-label="Insert square root">√</button>
      <button type="button" class="ans-tool${supOn?" on":""}" data-toggle-sup="${i}" aria-pressed="${supOn}" aria-label="Type a power (index)">xⁿ</button>
    </span>`}`;
}
function answerBoxHtml(q){
  const spec = answerSpec(q); const a = state.ans || (resetAnswerState(), state.ans);
  const left = MAX_TRIES - a.tries;
  const dots = Array.from({length:MAX_TRIES}, (_,i)=>`<span class="try-dot${i<a.tries?" used":""}"></span>`).join("");
  if(a.result){
    const pts = ratingDelta(a.result==="correct" ? "correct" : "wrong", state.hintIndex + (a.result==="correct" ? 0 : 1), q.marks||1);
    const head = a.result==="correct"
      ? `<div class="ans-result ok">✓ Correct${a.tries ? ` after ${a.tries} wrong ${a.tries===1?"try":"tries"}` : " first time"}!</div>`
      : `<div class="ans-result bad">Out of tries. Here's the answer and full solution.</div>`;
    const answers = spec.filter(p=>!p.table).map(p=>`${p.prefix ? esc(p.prefix)+" " : p.label ? `(${esc(p.label)}) ` : ""}${prettyAnswer(p.display)}`).join(spec.some(p=>p.group) ? ", " : " · ");
    return `<div class="answer-box done">${head}
      ${spec.some(p=>p.table) ? `<div class="qlist-topic">The completed table is shown above${spec.some((p,i)=>p.table && !a.ok[i]) ? " (answers you missed are highlighted)" : ""}.</div>` : ""}
      ${answers ? `<div class="qlist-topic">Answer: <strong>${answers}</strong></div>` : ""}
      <div class="qlist-topic">Score: <strong>${fmtPoints(pts)} / ${q.marks||1}</strong>${state.hintIndex ? ` · ${state.hintIndex} hint${state.hintIndex===1?"":"s"}` : ""}${a.tries ? ` · ${a.tries} wrong ${a.tries===1?"try":"tries"}` : ""}</div>
    </div>`;
  }
  const hasTable = spec.some(p=>p.table);
  const rows = spec.map((p,i)=>p.table ? "" : `<div class="ans-row${p.kind ? " frac-row" : ""}">
      ${p.prefix ? `<span class="ans-label ans-prefix">${esc(p.prefix)}</span>` : p.label ? `<span class="ans-label">(${esc(p.label)})</span>` : ""}
      ${answerInputHtml(p, i, a)}
      ${a.ok[i] ? `<span class="ans-tick" aria-label="correct">✓</span>` : ""}
    </div>`).join("");
  const anyText = spec.some(p=>!p.kind && !p.table), anyFrac = spec.some(p=>p.kind);
  const help = [
    spec.some(p=>p.group) ? `Type one solution in each box, in any order.` : "",
    anyText ? `Type just the final answer, e.g. <em>12</em>, <em>2.5</em> or <em>5√2</em>. Use <strong>√</strong> for a square root and <strong>x<sup>n</sup></strong> to type a power: tap it, type the power, then tap it again.` : "",
    anyFrac ? `For a fraction, put the top number in the upper box and the bottom number in the lower box.` : "",
    hasTable ? `Fill in every empty box in the table.` : "",
    `Wrong tries don't cost points, but if all ${MAX_TRIES} are wrong you lose 1 point. The solution unlocks when you're right, or after ${MAX_TRIES} tries.`
  ].filter(Boolean).join(" ");
  return `<div class="answer-box">
    <div class="ans-head"><span>${hasTable ? (spec.some(p=>!p.table) ? "Complete the table and your answers" : "Complete the table above") : spec.length>1 ? "Your answers" : "Your answer"}</span><span class="try-dots" aria-label="${left} tries left">${dots}</span></div>
    ${rows}
    ${a.feedback ? `<div class="ans-feedback" role="status">${esc(a.feedback)}</div>` : ""}
    <button class="btn-primary" id="checkAnsBtn">Check answer</button>
    <div class="ans-help">${help}</div>
  </div>`;
}
function readDrafts(){
  const a = state.ans;
  document.querySelectorAll("[data-ans]").forEach(el=>{
    const i = el.dataset.ans;
    if(el.dataset.field){ const o = (a.drafts[i] && typeof a.drafts[i]==="object") ? a.drafts[i] : {}; o[el.dataset.field] = el.value; a.drafts[i] = o; }
    else a.drafts[i] = el.value;
  });
}
function checkTypedAnswer(){
  const q = state.current; const spec = answerSpec(q); const a = state.ans;
  if(!q || !spec || a.result) return;
  readDrafts();
  const pending = spec.map((p,i)=>i).filter(i=>!a.ok[i]);
  const empty = pending.filter(i=>!partFilled(i, spec[i]));
  if(empty.length){
    a.feedback = spec[empty[0]].table ? "Fill in every box in the table first." : spec[empty[0]].kind ? "Fill in both the top and bottom of the fraction first." : spec.length>1 ? "Fill in every part first." : "Type an answer first.";
    render(); focusAnswer(); return;
  }
  let allOk = true;
  a.bad = {}; a.matched = a.matched || {};
  const groups = {};
  spec.forEach((p,i)=>{ if(p.group) (groups[p.group] = groups[p.group] || []).push(i); });
  Object.values(groups).forEach(idx=>{
    const remaining = [...spec[idx[0]].answers];
    idx.filter(i=>a.ok[i]).forEach(i=>{ const j = remaining.indexOf(a.matched[i]); if(j>=0) remaining.splice(j,1); });
    idx.filter(i=>!a.ok[i]).forEach(i=>{
      const j = remaining.findIndex(v=>checkPart(partInput(i, spec[i]), {...spec[i], answers:[v]}));
      if(j>=0){ a.ok[i] = true; a.matched[i] = remaining[j]; remaining.splice(j,1); }
      else { allOk = false; a.bad[i] = true; }
    });
  });
  pending.filter(i=>!spec[i].group).forEach(i=>{ if(checkPart(partInput(i, spec[i]), spec[i])) a.ok[i] = true; else { allOk = false; a.bad[i] = true; } });
  if(allOk){ finishTyped("correct"); return; }
  a.tries++;
  if(a.tries>=MAX_TRIES){ finishTyped("wrong"); return; }
  const left = MAX_TRIES - a.tries;
  const someRight = spec.length>1 && Object.keys(a.ok).length;
  const wrongCells = spec.filter((p,i)=>p.table && a.bad[i]).length;
  const what = wrongCells ? `${wrongCells} box${wrongCells===1?" isn't":"es aren't"} right yet (outlined in red)` : someRight ? "Not all parts are right yet" : "Not quite";
  a.feedback = left===1 ? `✗ ${what}. Last try: if this one's wrong too, you lose 1 point.` : `✗ ${what}. ${left} tries left.`;
  render(); focusAnswer();
}
function focusAnswer(){ const el = document.querySelector(".ans-input.bad") || document.querySelector(".ans-input:not([disabled])"); if(el){ el.focus(); if(el.select) el.select(); } }
function finishTyped(result){
  const a = state.ans;
  a.result = result; a.feedback = "";
  state.solutionShown = true;
  const penalty = state.hintIndex + (result==="correct" ? 0 : 1);   // only the last wrong try costs a point
  a.attempt = recordRating(result, penalty, { auto:true, wrongTries:a.tries, hintsUsed:state.hintIndex });
  render();
  const nb = document.getElementById("nextQBtn"); if(nb) nb.focus();
}
// Inserts text at the cursor of an answer box.
function insertAtCursor(el, text){
  const start = el.selectionStart ?? el.value.length, end = el.selectionEnd ?? el.value.length;
  el.value = el.value.slice(0, start) + text + el.value.slice(end);
  const pos = start + text.length;
  el.focus(); try{ el.setSelectionRange(pos, pos); }catch(e){}
  state.ans.drafts[el.dataset.ans] = el.value;
}
function attachAnswerHandlers(){
  if(state.screen!=="practice" || !state.current || !usesTypedAnswer(state.current)) return;
  const btn = document.getElementById("checkAnsBtn"); if(btn) btn.onclick = checkTypedAnswer;
  document.querySelectorAll("[data-ans]").forEach(el=>{
    el.oninput = ()=>{ readDrafts(); el.classList.remove("bad"); };
    el.onkeydown = (e)=>{ if(e.key==="Enter"){ e.preventDefault(); checkTypedAnswer(); } };
    if(!el.dataset.field){
      // Power (index) mode: characters typed while it's on come out raised, e.g. 2 -> ².
      el.addEventListener("beforeinput", (e)=>{
        const i = el.dataset.ans;
        if(!state.ans.sup[i] || e.inputType!=="insertText" || !e.data) return;
        const mapped = [...e.data].map(c=>SUP[c.toLowerCase()] || null);
        if(mapped.some(c=>c===null)) return;          // no raised version (e.g. a space): type it normally
        e.preventDefault();
        insertAtCursor(el, mapped.join(""));
      });
    }
  });
  document.querySelectorAll("[data-insert-sqrt]").forEach(b=>{
    b.onmousedown = (e)=>e.preventDefault();               // keep the cursor in the box
    b.onclick = ()=>{ const el = document.getElementById("ans"+b.dataset.insertSqrt); if(el) insertAtCursor(el, "√"); };
  });
  document.querySelectorAll("[data-toggle-sup]").forEach(b=>{
    b.onmousedown = (e)=>e.preventDefault();
    b.onclick = ()=>{
      const i = b.dataset.toggleSup; const el = document.getElementById("ans"+i);
      state.ans.sup[i] = !state.ans.sup[i];
      b.classList.toggle("on", state.ans.sup[i]); b.setAttribute("aria-pressed", String(state.ans.sup[i]));
      if(el) el.focus();
    };
  });
  const nb = document.getElementById("nextQBtn");
  if(nb) nb.onclick = ()=>{ nextQuestion(); render(); window.scrollTo(0,0); };
}

// ======================= GENERATE A PAPER =======================
// Builds a printable exam-style paper from the chosen topics, up to a target number of marks,
// plus a separate mark scheme with fully worked solutions. "Save as PDF" uses the browser's
// print dialog (choose "Save as PDF" / "Save to Files"), so maths and diagrams stay sharp.
// Mark-scheme marks come from tags at the end of solution lines, e.g. "... = £95 [A1]" or "[M1 M1 A1]".
const MARK_TAG = /\s*\[((?:[MABPCE]\d\s*)+)\]\s*$/;
const MARK_INFO = { M:"Method mark", A:"Accuracy mark (depends on the method mark before it)", B:"Independent mark", P:"Process mark", C:"Communication mark", E:"Explanation mark" };
const paper = { topics:null, marks:40, doc:null, view:"paper", error:"" };

function solutionLines(text){
  return String(text||"").split("\n").map(line=>{
    const m = line.match(MARK_TAG);
    return { text: m ? line.replace(MARK_TAG,"") : line, marks: m ? m[1].trim().split(/\s+/) : [] };
  });
}
function markBadges(list){ return list.length ? `<span class="mk-wrap">${list.map(k=>`<span class="mk mk-${k[0]}" title="${esc(MARK_INFO[k[0]]||"Mark")}">${esc(k)}</span>`).join("")}</span>` : ""; }
// Worked solution with mark badges on the lines where marks are earned.
function solutionHtml(text){
  return solutionLines(text).map(l=> l.text.trim()==="" && !l.marks.length ? `<div class="sol-gap"></div>`
    : `<div class="sol-line"><span class="sol-text">${esc(l.text)}</span>${markBadges(l.marks)}</div>`).join("");
}
function hasMarkTags(q){ return solutionLines(q.solution).some(l=>l.marks.length); }
function questionFamily(q){ return q.inspiredBy ? "i:" + q.inspiredBy : "d:" + String(q.id).replace(/[a-z]$/,""); }

function paperTopics(){ return getAllTopics().filter(t=>t.questions.length>0); }
function renderPaperSetup(){
  const topics = paperTopics(), subj = subjectInfo();
  if(paper.topics===null) paper.topics = state.selected.length ? state.selected.filter(n=>topics.some(t=>t.topic===n)) : topics.map(t=>t.topic);
  const folders = {};
  topics.forEach(t=>{ (folders[t.category] = folders[t.category] || []).push(t); });
  const avail = paperPool().reduce((n,q)=>n + (q.marks||1), 0);
  const chk = t=>{
    const pool = t.questions.filter(q=>calcAllows(q) && !getQState(q.id).suspended);
    return `<label class="chk paper-topic"><input type="checkbox" data-paper-topic="${esc(t.topic)}" ${paper.topics.includes(t.topic)?"checked":""}> <span>${esc(t.topic)} <span class="paper-count">${pool.length} q · ${pool.reduce((n,q)=>n+(q.marks||1),0)} marks</span></span></label>`;
  };
  return `<div class="toprow"><h2>Generate a paper</h2><button class="link-btn" id="paperBackBtn">Back</button></div>
    <div class="sub">Pick the topics and how many marks you want. You'll get a numbered exam-style paper, plus a separate mark scheme with fully worked solutions, both ready to save as PDFs.</div>
    ${!topics.length ? `<div class="card">There aren't any ${esc(subj.name)} questions yet.</div>` : `
    <div class="card paper-controls">
      <label class="field" for="paperMarks" style="margin-top:0;">Total marks</label>
      <div class="paper-chips">${[20,40,60,80,100].map(n=>`<button type="button" class="icon-btn${paper.marks===n?" accent":""}" data-paper-marks="${n}">${n}</button>`).join("")}</div>
      <input type="number" id="paperMarks" min="5" max="200" value="${paper.marks}">
      ${isGcse() ? `<label class="field">Paper type</label>${calcToggleHtml()}` : ""}
    </div>
    <div class="card">
      <div class="q-card-head" style="margin-bottom:6px;"><h2 style="font-size:1rem;margin:0;">Topics</h2>
        <div><button class="link-btn" id="paperAllBtn">Select all</button><button class="link-btn" id="paperNoneBtn">Clear</button></div></div>
      ${Object.entries(folders).map(([f, ts])=>`<div class="paper-folder"><div class="qlist-topic"><strong>${esc(f)}</strong></div>${ts.map(chk).join("")}</div>`).join("")}
    </div>
    <div class="sub">${paper.topics.length} topic${paper.topics.length===1?"":"s"} selected · ${avail} marks of questions available</div>
    ${paper.error ? `<div class="auth-msg err">${esc(paper.error)}</div>` : ""}
    <button class="btn-primary" id="paperGoBtn">Generate paper</button>`}`;
}
function paperPool(){
  const chosen = new Set(paper.topics||[]);
  const out = [];
  paperTopics().filter(t=>chosen.has(t.topic)).forEach(t=>t.questions.forEach(q=>{
    if(!calcAllows(q) || getQState(q.id).suspended) return;
    out.push({...q, topic:t.topic});
  }));
  return out;
}
// Picks questions to reach the target marks, spreading across topics and never using two
// versions of the same original question.
function buildPaper(){
  const target = Math.max(5, Math.min(200, parseInt(paper.marks)||40));
  const pool = shuffleArr(paperPool());
  if(!pool.length) return { error:"Choose at least one topic with questions." };
  const byTopic = {};
  pool.forEach(q=>{ (byTopic[q.topic] = byTopic[q.topic] || []).push(q); });
  const topicOrder = shuffleArr(Object.keys(byTopic));
  const chosen = [], usedFam = new Set(), usedId = new Set();
  let total = 0, progress = true;
  const fits = q=>!usedId.has(q.id) && !usedFam.has(questionFamily(q)) && total + (q.marks||1) <= target;
  const take = q=>{ chosen.push(q); usedId.add(q.id); usedFam.add(questionFamily(q)); total += q.marks||1; };
  while(progress && total < target){           // one question per topic per round
    progress = false;
    for(const t of topicOrder){
      const q = byTopic[t].find(fits);
      if(q){ take(q); progress = true; if(total>=target) break; }
    }
  }
  pool.filter(fits).sort((a,b)=>(b.marks||1)-(a.marks||1)).forEach(q=>{ if(fits(q)) take(q); });   // top up
  if(!chosen.length) return { error:`No questions fit in ${target} marks. Try a bigger total.` };
  chosen.sort((a,b)=>(a.marks||1)-(b.marks||1) || (Math.random()-0.5));      // shorter questions first, like an exam
  const calcSet = new Set(chosen.filter(q=>typeof q.calculator==="boolean").map(q=>q.calculator));
  return { subject:currentSubject(), questions:chosen, total, target, created:Date.now(),
           code:Math.random().toString(36).slice(2,8).toUpperCase(),
           calc: isGcse() ? (calcSet.size===1 ? ([...calcSet][0] ? "calc" : "noncalc") : "mixed") : null,
           topics:[...new Set(chosen.map(q=>q.topic))] };
}
function suggestedMinutes(total, sid){ const perMark = isGcse(sid) ? 1.1 : 1.2; return Math.max(5, Math.round(total*perMark/5)*5); }
function answerLinesHtml(q){

  return `<div class="pd-work" style="min-height:${space}px"></div>${lines}`;
}

// A-Level papers: each question starts on a new lined page, plus one extra lined page for every

function alevelExtraPages(marks){ return Math.max(0, Math.ceil((marks||1)/3) - 1); }
function alevelPaperHtml(doc){
  const last = doc.questions.length - 1;

    const extra = alevelExtraPages(q.marks), m = q.marks||1;
    const total = `<div class="pd-total">(Total for Question ${i+1} is ${m} mark${m===1?"":"s"})</div>${i===last ? `<div class="pd-end">TOTAL FOR PAPER IS ${doc.total} MARKS</div>` : ""}`;

      <div class="al-cont">Question ${i+1} continued</div><div class="al-lines"></div>${k===extra ? total : ""}
    </section>`;

function msDocHtml(doc){

function attachPaperHandlers(){

    };

      const mkEl = document.getElementById("paperMarks"); if(mkEl) paper.marks = Math.max(5, Math.min(200, parseInt(mkEl.value)||40));

      paper.error = ""; paper.doc = r; paper.view = "paper"; state.screen = "paperView"; render(); window.scrollTo(0,0);
    };
  }
  if(state.screen==="paperView"){
    const ed = document.getElementById("paperEditBtn"); if(ed) ed.onclick = ()=>{ state.screen = "paperSetup"; render(); };
    document.querySelectorAll("[data-paper-view]").forEach(b=>{ b.onclick = ()=>{ paper.view = b.dataset.paperView; render(); }; });

    };
    const pp = document.getElementById("paperPractiseBtn"); if(pp) pp.onclick = ()=>practiseIds(paper.doc.questions.map(q=>q.id), "select");
  }
  const open = document.getElementById("openPaperBtn");
  if(open) open.onclick = ()=>{ paper.topics = null; paper.error = ""; state.screen = "paperSetup"; render(); window.scrollTo(0,0); };
}

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function splitPromptLines(str){
  const out = []; let cur = ""; let inDisplay = false;
  for(let i=0;i<str.length;i++){
    if(str[i]==="\\" && str[i+1]==="$"){ cur += "\\$"; i++; continue; }
    if(str[i]==="$" && str[i+1]==="$"){ inDisplay = !inDisplay; cur += "$$"; i++; continue; }
    if(str[i]==="\n" && !inDisplay){ out.push(cur); cur = ""; continue; }
    cur += str[i];
  }
  out.push(cur);
  return out;
}
// Lays a question out line by line, pulling any trailing "(n)" mark into a fixed right-hand column
function fmtPrompt(text){
  const rows = [];
  splitPromptLines(String(text==null ? "" : text)).forEach(line=>{
    const only = line.match(/^\s*\((\d{1,2})\)\s*$/);
    if(only){
      const last = rows[rows.length-1];
      if(last && last.mark===null) last.mark = only[1]; else rows.push({text:"", mark:only[1]});
      return;
    }
    const m = line.match(/^([\s\S]*?\S)\s+\((\d{1,2})\)\s*$/);
    rows.push(m ? {text:m[1], mark:m[2]} : {text:line, mark:null});
  });
  return rows.map(r=>{
    if(r.text.trim()==="" && r.mark===null) return '<div class="qgap"></div>';
    return `<div class="qline"><div class="qtext">${esc(r.text)}</div>${r.mark!==null ? `<div class="qmark">(${r.mark})</div>` : ""}</div>`;
  }).join("");
}

function getAllTopics(subject){

    map[t.topic].questions.push(...t.questions.map(q=>({...q, subject:sid})));

}

function topicDueInfo(questions){
  const now = Date.now();
  const active = questions.filter(q=>!getQState(q.id).suspended);
  if(active.length===0) return "All hidden";
  const minDue = Math.min(...active.map(q=>getQState(q.id).due||0));
  if(minDue <= now) return "Due now";
  const days = Math.ceil((minDue-now)/DAY_MS);
  return `Due in ${days} day${days===1?"":"s"}`;
}

function computeSchedule(streakBefore, rating){
  let streak = streakBefore;
  if(rating === "correct") streak = Math.min(streak+1, INTERVAL_DAYS.length-1);
  else if(rating === "silly") streak = Math.max(Math.floor(streak/2), 0);
  else streak = 0;
  const days = INTERVAL_DAYS[streak];
  return { streak, due: Date.now() + days*DAY_MS };
}

function statsForRange(rangeDays){
  const attempts = loadAttempts();
  const cutoff = rangeDays ? Date.now() - rangeDays*DAY_MS : 0;
  const byTopic = {};
  attempts.filter(a=>a.ts>=cutoff).forEach(a=>{
    const key = topicKey(a.subject, a.topic);
    if(!byTopic[key]) byTopic[key] = {seen:0, correct:0, silly:0, wrong:0, possibleMarks:0, earnedPoints:0};
    const s = byTopic[key];
    const marks = a.marks||1;
    s.seen++;
    if(a.rating==="correct") s.correct++;
    else if(a.rating==="silly") s.silly++;
    else s.wrong++;
    s.possibleMarks += marks;
    s.earnedPoints += ratingDelta(a.rating, a.hints, marks);
  });
  return byTopic;
}

function editAttemptRating(attemptId, newRating){
  const attempts = loadAttempts();
  const attempt = attempts.find(a=>a.id===attemptId);
  if(!attempt || attempt.rating===newRating) return;
  const oldRating = attempt.rating;
  const marks = attempt.marks||1;
  const prog = loadProgress();
  const stat = getTopicStat(prog, topicKey(attempt.subject, attempt.topic));
  if(oldRating==="correct") stat.correct = Math.max(0, stat.correct-1);
  else if(oldRating==="silly") stat.silly = Math.max(0, stat.silly-1);
  else stat.wrong = Math.max(0, stat.wrong-1);
  if(newRating==="correct") stat.correct++;
  else if(newRating==="silly") stat.silly++;
  else stat.wrong++;
  stat.earnedPoints += ratingDelta(newRating, attempt.hints, marks) - ratingDelta(oldRating, attempt.hints, marks);
  prog[topicKey(attempt.subject, attempt.topic)] = stat;
  saveProgress(prog);
  state.progress = prog;
  attempt.rating = newRating;
  saveAttempts(attempts);
  const sched = computeSchedule(attempt.qStreakBefore, newRating);
  setQState(attempt.qid, sched);
  if(state.session && state.session.lastAttemptId===attemptId){
    state.session.earnedPoints += ratingDelta(newRating, attempt.hints, marks) - ratingDelta(oldRating, attempt.hints, marks);
  }
}

  items = items.filter(it=>calcAllows(it.q));

function difficultyAllows(marks){
  if(!(state.includeEasy || state.includeMedium || state.includeHard)) return true; // nothing ticked — treat as all
  const k = difficultyOf(marks, currentSubject()).key;
  return (k==="easy" && state.includeEasy) || (k==="medium" && state.includeMedium) || (k==="hard" && state.includeHard);
}

function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function collectPool(dueOnly){
  let pool = [];
  const now = Date.now();
  getAllTopics().filter(t=>state.selected.includes(t.topic)).forEach(t=>{
    t.questions.forEach(q=>{
      const marks = q.marks||1;
      if(!difficultyAllows(marks)) return;
      if(!calcAllows(q)) return;
      const qs = getQState(q.id);
      if(qs.suspended) return;
      if(dueOnly && qs.due > now) return;
      pool.push({...q, topic:t.topic});
    });
  });
  return pool;
}

function buildQueue(includeNotDue){
  const target = parseInt(state.targetMarks);
  const duePool = shuffleArr(collectPool(true));
  if(target > 0){
    let sum = 0; const chosen = []; const chosenIds = new Set();
    for(const q of duePool){
      if(sum >= target) break;
      chosen.push(q); chosenIds.add(q.id); sum += q.marks||1;
    }
    if(sum < target){
      const extraPool = shuffleArr(collectPool(false)).filter(q=>!chosenIds.has(q.id));
      for(const q of extraPool){
        if(sum >= target) break;
        chosen.push(q); sum += q.marks||1;
      }
    }
    return chosen;
  }
  return includeNotDue ? shuffleArr(collectPool(false)) : duePool;
}

// Saves one attempt: updates topic stats, history, scheduling, the session score and coins.
// "penalty" is points taken off: hints used, plus wrong tries on GCSE typed answers.
function recordRating(rating, penalty, extra){
  const q = state.current;
  const marks = q.marks||1;
  const hints = penalty||0;
  const delta = ratingDelta(rating, hints, marks);
  const tkey = topicKey(q.subject, q.topic);
  const stat = getTopicStat(state.progress, tkey);
  stat.seen++;
  if(rating==="correct") stat.correct++;
  else if(rating==="silly") stat.silly++;
  else stat.wrong++;
  stat.possibleMarks += marks;
  stat.earnedPoints += delta;
  state.progress[tkey] = stat;
  saveProgress(state.progress);

  const qStreakBefore = getQState(q.id).streak;
  const attempt = { id:"a"+Date.now()+Math.random().toString(36).slice(2,7), topic:q.topic, subject:subjectOf(q), qid:q.id, rating, hints, marks, ts:Date.now(), qStreakBefore, ...(extra||{}) };
  const attempts = loadAttempts();
  attempts.push(attempt);
  saveAttempts(attempts);
  scheduleAfterRating(q.id, rating);

  if(!state.session) state.session = { possibleMarks:0, earnedPoints:0, answered:0 };
  state.session.possibleMarks += marks;
  state.session.earnedPoints += delta;
  state.session.answered++;
  state.session.lastAttemptId = attempt.id;

  state.lastAnswered = { ...q, rating, attemptId: attempt.id, hintsUsed: (extra && extra.hintsUsed!==undefined) ? extra.hintsUsed : hints, auto: !!(extra && extra.auto), wrongTries: extra && extra.wrongTries };
  requestCoins(q, rating, hints);
  return attempt;
}
function nextQuestion(){
  state.current = state.queue.shift() || null;
  state.hintIndex = 0;
  state.solutionShown = false;
  state.reportOpen = false;
  resetAnswerState();
}

function scheduleAfterRating(qid, rating){
  const qs = getQState(qid);
  const sched = computeSchedule(qs.streak, rating);
  setQState(qid, sched);
}

      q.rating = newRating;
      if(state.lastAnswered && state.lastAnswered.attemptId===q.attemptId) state.lastAnswered.rating = newRating;
      state.reviewEditing = false;
      state.toast = { message:"Response updated.", showUndo:false };

      setTimeout(()=>{ state.toast=null; render(); }, 3000);
    };
  });

  const suspendBtn = document.getElementById("suspendBtn");
  if(suspendBtn) suspendBtn.onclick = ()=>{

    nextQuestion();

      const dest = state.practiceOrigin==="browse" ? "browse" : "decks";
      state.session=null; state.practiceOrigin=null; state.screen=dest;

  if(addHintBtn) addHintBtn.onclick = ()=>{ syncFormHintsFromDOM(); state.formHints.push(""); render(); };

  });

  if(cancelEditBtn) cancelEditBtn.onclick = ()=>{ state.editForm=null; state.formHints=[""]; state.formDiagramImage=null; state.formDiagramRemoved=false; render(); };
  const saveQBtn = document.getElementById("saveQBtn");
  if(saveQBtn) saveQBtn.onclick = ()=>{
    syncFormHintsFromDOM();
    const topics = getAllTopics();
    const topic = document.getElementById("topicSelect").value;
    const prompt = document.getElementById("qPrompt").value.trim();
    const solution = document.getElementById("qSolution").value.trim();
    const marks = Math.max(1, parseInt(document.getElementById("qMarks").value) || 1);
    const year = document.getElementById("qYear").value.trim();
    const paper = document.getElementById("qPaper").value.trim();
    const link = document.getElementById("qLink").value.trim();
    const hints = state.formHints.map(h=>h.trim()).filter(h=>h.length>0);
    if(!topic || !prompt || !solution){ alert("Please pick a topic, and fill in the question and solution."); return; }
    const calcEl = document.getElementById("qCalc");
    if(calcEl && !calcEl.value){ alert("Please choose whether this is a calculator or non-calculator question."); calcEl.focus(); return; }
    const calcField = calcEl ? { calculator: calcEl.value==="calc" } : {};
    const tableEl = document.getElementById("qTable");
    if(tableEl && tableEl.value.trim()){
      if(!parseTable(tableEl.value.trim())){ alert("The table couldn't be read. Put one row per line with cells separated by |"); tableEl.focus(); return; }
      calcField.table = tableEl.value.trim().slice(0, 5000);
    }
    const ansEl = document.getElementById("qAnswer");
    if(ansEl){
      const main = ansEl.value.trim();
      const alts = (document.getElementById("qAnswerAlt").value||"").split("\n").map(x=>x.trim()).filter(Boolean);
      if(main && document.getElementById("qRoots").checked){
        const vm = main.match(/^\s*([a-z])\s*=/i);
        const vals = main.split(/,|;|\bor\b|\band\b/i).map(x=>x.replace(/^\s*[a-z]\s*=\s*/i,"").trim()).filter(Boolean);
        if(vals.length<2){ alert('For separate boxes, write each solution, e.g. "x = -5 or x = 2".'); ansEl.focus(); return; }
        calcField.roots = vals; if(vm) calcField.variable = vm[1];
        if(document.getElementById("qExact").checked) calcField.exact = true;
      }
      else if(main){ calcField.answers = [main, ...alts.filter(x=>x!==main)]; if(document.getElementById("qExact").checked) calcField.exact = true; }
      else if(alts.length){ alert("Put the main answer in \"Final answer\" first."); ansEl.focus(); return; }
    }
    const existingTopicObj = topics.find(t=>t.topic===topic);
    const category = existingTopicObj ? existingTopicObj.category : "General";
    const ef = state.editForm;
    const captionEl = document.getElementById("qDiagramCaption");
    const caption = captionEl ? captionEl.value.trim() : "";
    let diagram = null;
    if(!state.formDiagramRemoved){
      if(state.formDiagramImage) diagram = { image: state.formDiagramImage.image, caption, alt: caption || "Diagram" };
      else if(ef && ef.diagram) diagram = { ...ef.diagram, caption: caption || ef.diagram.caption || "" };
    }
    const custom = loadCustom();
    let finalId;
    if(ef){
      const sid = currentSubject();
      const oldEntry = custom.find(t=>t.topic===ef.topic && subjectOf(t)===sid);
      if(oldEntry) oldEntry.questions = oldEntry.questions.filter(q=>q.id!==ef.id);
      let newEntry = custom.find(t=>t.topic===topic && subjectOf(t)===sid);
      if(!newEntry){ newEntry = {topic, category, subject:sid, questions:[]}; custom.push(newEntry); }
      finalId = ef.id;
      newEntry.questions.push({ id: ef.id, prompt, hints: hints.length?hints:["Think about which technique applies here."], solution, marks, year, paper, link, subtopic: ef.subtopic||"", ...calcField, ...(diagram ? {diagram} : {}) });
      saveCustom(custom.filter(t=>t.questions.length>0));
      state.editForm = null;
    } else {
      const sid = currentSubject();
      let entry = custom.find(t=>t.topic===topic && subjectOf(t)===sid);
      if(!entry){ entry = {topic, category, subject:sid, questions:[]}; custom.push(entry); }
      finalId = "c"+Date.now();
      entry.questions.push({ id: finalId, prompt, hints: hints.length?hints:["Think about which technique applies here."], solution, marks, year, paper, link, ...calcField, ...(diagram ? {diagram} : {}) });
      saveCustom(custom);
    }
    const checkedDeckIds = new Set([...document.querySelectorAll('[data-deck-assign]:checked')].map(cb=>cb.dataset.deckAssign));
    const decks = loadDecks();
    let decksChanged = false;
    decks.forEach(d=>{
      const has = d.questionIds.includes(finalId);
      if(checkedDeckIds.has(d.id) && !has){ d.questionIds.push(finalId); decksChanged = true; }
      else if(!checkedDeckIds.has(d.id) && has){ d.questionIds = d.questionIds.filter(id=>id!==finalId); decksChanged = true; }
    });
    if(decksChanged) saveDecksL(decks);
    state.formHints = [""];
    state.formDiagramImage = null;
    state.formDiagramRemoved = false;
    render();
  };
  const qImageFile = document.getElementById("qImageFile");
  if(qImageFile) qImageFile.onchange = ()=>{
    const f = qImageFile.files && qImageFile.files[0];
    const status = document.getElementById("imageUploadStatus");
    if(!f) return;
    if(f.size > 1500000){
      if(status) status.textContent = "That image is quite large (" + Math.round(f.size/1024) + " KB) — it's saved in this browser's storage, so very large images may not fit. Consider a smaller file if saving fails.";
    } else if(status) status.textContent = "";
    const reader = new FileReader();
    reader.onload = ()=>{
      state.formDiagramImage = { image: String(reader.result||""), caption:"" };
      state.formDiagramRemoved = false;
      render();
    };
    reader.onerror = ()=>{ if(status) status.textContent = "Couldn't read that image."; };
    reader.readAsDataURL(f);
  };
  const removeDiagramBtn = document.getElementById("removeDiagramBtn");
  if(removeDiagramBtn) removeDiagramBtn.onclick = ()=>{
    state.formDiagramImage = null;
    state.formDiagramRemoved = true;
    render();
  };
  document.querySelectorAll('[data-edit-topic]').forEach(btn=>{
    btn.onclick = ()=>{
      const custom = loadCustom();
      const entry = custom.find(t=>t.topic===btn.dataset.editTopic && subjectOf(t)===currentSubject());
      const q = entry && entry.questions.find(q=>q.id===btn.dataset.editId);
      if(!q) return;
      state.editForm = { topic: btn.dataset.editTopic, category: entry.category, id: q.id, prompt: q.prompt, solution: q.solution, marks: q.marks||1, year: q.year||"", paper: q.paper||"", link: q.link||"", subtopic: q.subtopic||"", calculator: q.calculator, table: q.table, roots: q.roots, variable: q.variable, answers: q.answers || (q.answer!==undefined ? [String(q.answer)] : undefined), exact: q.exact, diagram: q.diagram||null };
      state.formHints = q.hints && q.hints.length ? [...q.hints] : [""];
      state.formDiagramImage = null;
      state.formDiagramRemoved = false;
      render();
      document.getElementById("qPrompt").scrollIntoView({behavior:"smooth", block:"start"});
    };
  });
  document.querySelectorAll('[data-del-topic]').forEach(btn=>{
    btn.onclick = ()=>{
      const custom = loadCustom();
      const entry = custom.find(t=>t.topic===btn.dataset.delTopic && subjectOf(t)===currentSubject());
      if(entry){
        entry.questions = entry.questions.filter(q=>q.id!==btn.dataset.delId);
        saveCustom(custom.filter(t=>t.questions.length>0));
      }
      render();
    };
  });
  document.querySelectorAll('[data-unhide]').forEach(btn=>{
    btn.onclick = ()=>{ setQState(btn.dataset.unhide, { suspended:false }); render(); };
  });
  document.querySelectorAll('[data-dismiss-report]').forEach(btn=>{
    btn.onclick = ()=>{
      const reports = loadReports();
      reports.splice(Number(btn.dataset.dismissReport), 1);
      saveReports(reports);
      render();
    };
  });

  document.querySelectorAll('[data-deck-open]').forEach(btn=>{
    btn.onclick = ()=>{ state.deckPickerFor = btn.dataset.deckOpen; render(); };
  });
  document.querySelectorAll('[data-deck-cancel]').forEach(btn=>{
    btn.onclick = ()=>{ state.deckPickerFor = null; render(); };
  });
  document.querySelectorAll('[data-deck-add-existing]').forEach(btn=>{
    btn.onclick = ()=>{
      const qid = btn.dataset.deckAddExisting;
      const sel = document.getElementById("deckPickSelect");
      const deckId = sel && sel.value;
      if(!deckId){ alert("Create a deck first, or pick one from the list."); return; }
      const decks = loadDecks();
      const deck = decks.find(d=>d.id===deckId);
      if(deck && !deck.questionIds.includes(qid)) deck.questionIds.push(qid);
      saveDecksL(decks);
      state.deckPickerFor = null;
      state.toast = { message: `Added to "${deck ? deck.name : "deck"}".`, showUndo:false };
      render();
      setTimeout(()=>{ state.toast=null; render(); }, 3000);
    };
  });
  document.querySelectorAll('[data-deck-add-new]').forEach(btn=>{
    btn.onclick = ()=>{
      const qid = btn.dataset.deckAddNew;
      const nameEl = document.getElementById("deckNewName");
      const name = nameEl ? nameEl.value.trim() : "";
      if(!name){ alert("Give the new deck a name."); return; }
      const decks = loadDecks();
      const deck = { id:"deck"+Date.now()+Math.random().toString(36).slice(2,6), name, questionIds:[qid] };
      decks.push(deck);
      saveDecksL(decks);
      state.deckPickerFor = null;
      state.toast = { message: `Created "${name}" and added the question.`, showUndo:false };
      render();
      setTimeout(()=>{ state.toast=null; render(); }, 3000);
    };
  });
  const createDeckBtn = document.getElementById("createDeckBtn");
  if(createDeckBtn) createDeckBtn.onclick = ()=>{
    const nameEl = document.getElementById("newDeckStandaloneName");
    const name = nameEl ? nameEl.value.trim() : "";
    if(!name){ alert("Give the deck a name."); return; }
    const decks = loadDecks();
    decks.push({ id:"deck"+Date.now()+Math.random().toString(36).slice(2,6), name, questionIds:[] });
    saveDecksL(decks);
    render();
  };
  document.querySelectorAll('[data-deck-view]').forEach(btn=>{
    btn.onclick = ()=>{ state.viewDeckId = state.viewDeckId===btn.dataset.deckView ? null : btn.dataset.deckView; render(); };
  });
  document.querySelectorAll('[data-deck-rename]').forEach(btn=>{
    btn.onclick = ()=>{
      const decks = loadDecks();
      const deck = decks.find(d=>d.id===btn.dataset.deckRename);
      if(!deck) return;
      const name = prompt("Rename deck", deck.name);
      if(name && name.trim()){ deck.name = name.trim(); saveDecksL(decks); render(); }
    };
  });
  document.querySelectorAll('[data-deck-delete]').forEach(btn=>{
    btn.onclick = ()=>{
      if(!confirm("Delete this deck? The questions themselves are not affected.")) return;
      const decks = loadDecks().filter(d=>d.id!==btn.dataset.deckDelete);
      saveDecksL(decks);
      if(state.viewDeckId===btn.dataset.deckDelete) state.viewDeckId = null;
      render();
    };
  });
  document.querySelectorAll('[data-deck-remove-q]').forEach(btn=>{
    btn.onclick = ()=>{
      const [deckId, qid] = btn.dataset.deckRemoveQ.split("|");
      const decks = loadDecks();
      const deck = decks.find(d=>d.id===deckId);
      if(deck){ deck.questionIds = deck.questionIds.filter(id=>id!==qid); saveDecksL(decks); }
      render();
    };
  });
  document.querySelectorAll('[data-deck-practice]').forEach(btn=>{
    btn.onclick = ()=>{
      const deck = loadDecks().find(d=>d.id===btn.dataset.deckPractice);
      if(!deck || deck.questionIds.length===0) return;
      const pool = deck.questionIds
        .map(qid=>findQuestionById(qid))
        .filter(q=>q && !getQState(q.id).suspended);
      if(pool.length===0){ alert("Every question in this deck is currently hidden."); return; }
      state.queue = shuffleArr(pool);
      state.screen = "practice";
      state.lastAnswered = null;
      state.practiceOrigin = "decks";
      state.session = { possibleMarks:0, earnedPoints:0, answered:0 };
      nextQuestion();
      render();
      window.scrollTo(0,0);
    };
  });
}

function syncFormHintsFromDOM(){
  document.querySelectorAll('[data-hint-idx]').forEach(inp=>{
    state.formHints[Number(inp.dataset.hintIdx)] = inp.value;
  });
}

applyShopTheme();
document.title = SITE_NAME;
loadAdsScript();
initAccounts();
loadSubject(currentSubject()).catch(()=>{});
render();
</script>
</body>
</html>
