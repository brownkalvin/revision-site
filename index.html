<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revision Practice</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#fff; --ink:#1b1b1f; --sub:#6b6b74; --line:#e4e4e0;
  --accent:#3a5ba0; --accent-ink:#fff; --good:#2e7d4f; --warn:#b8860b; --bad:#b4432f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#16171a; --panel:#1f2024; --ink:#eceef1; --sub:#9a9ca3; --line:#2c2d31; --accent:#7fa1e0; --accent-ink:#101223; }
}
:root[data-theme="dark"]{ --bg:#16171a; --panel:#1f2024; --ink:#eceef1; --sub:#9a9ca3; --line:#2c2d31; --accent:#7fa1e0; --accent-ink:#101223; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100%;}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 80px;}
h1{font-size:1.3rem;margin:4px 0 2px;}
h2{font-size:1.1rem;margin:0 0 10px;}
h3{font-size:.85rem;color:var(--sub);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.03em;}
.sub{color:var(--sub);font-size:.9rem;margin-bottom:18px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
.folder{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;}
.folder>summary{padding:13px 16px;font-weight:600;cursor:pointer;list-style:none;}
.folder>summary::-webkit-details-marker{display:none;}
.folder-body{padding:0 16px 6px;}
.topic-row{display:grid;grid-template-columns:1fr 84px;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.browse-btn{width:84px;padding:10px 0;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:600;font-size:.9rem;cursor:pointer;}
.topic-row:last-child{border-bottom:none;}
.topic-name{font-weight:600;font-size:.95rem;}
.mastery{font-size:.76rem;color:var(--sub);text-align:right;}
label.chk{display:flex;align-items:center;gap:10px;}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);flex-shrink:0;}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px;}
textarea{min-height:64px;resize:vertical;}
label.field{display:block;font-size:.8rem;color:var(--sub);margin:10px 0 3px;}
button{font:inherit;border:none;border-radius:10px;padding:11px 16px;cursor:pointer;}
.btn-primary{background:var(--accent);color:var(--accent-ink);font-weight:600;width:100%;font-size:1rem;}
.btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--line);}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.btn-row button{flex:1;min-width:100px;}
.qmeta{font-size:.8rem;color:var(--sub);margin-bottom:6px;}
.qprompt{font-size:1.02rem;line-height:1.5;white-space:pre-wrap;}
.hintbox{margin-top:12px;padding:10px 12px;background:var(--bg);border-left:3px solid var(--accent);border-radius:6px;font-size:.92rem;}
.solbox{margin-top:12px;padding:10px 12px;background:var(--bg);border-left:3px solid var(--warn);border-radius:6px;font-size:.92rem;white-space:pre-wrap;}
.assess{margin-top:14px;}
.assess p{font-size:.85rem;color:var(--sub);margin-bottom:8px;}
.correct{background:var(--good);color:#fff;}
.silly{background:var(--warn);color:#fff;}
.wrong{background:var(--bad);color:#fff;}
.pill{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:20px;background:var(--line);color:var(--sub);margin-left:6px;}
a.reset{font-size:.78rem;color:var(--sub);text-decoration:underline;cursor:pointer;}
.hint-item{display:flex;gap:6px;margin-bottom:6px;}
.hint-item input{margin:0;}
.icon-btn{background:transparent;color:var(--bad);border:none;padding:6px 8px;font-size:.85rem;white-space:nowrap;}
.icon-btn.accent{color:var(--accent);}
.qlist-row{padding:10px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.qlist-row:last-child{border-bottom:none;}
.qlist-text{font-size:.88rem;}
.qlist-topic{font-size:.75rem;color:var(--sub);}
.qlist-actions{display:flex;gap:2px;flex-shrink:0;}
.toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;flex-wrap:wrap;}
.toprow-links{display:flex;gap:18px;margin-left:auto;}
.toprow-links{flex-wrap:wrap;align-items:center;row-gap:2px;}
.nav-link{background:none;border:none;color:var(--accent);text-decoration:underline;font-size:1.2rem;font-weight:700;padding:8px 4px;cursor:pointer;}
.theme-switch{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--sub);}
.theme-switch .track{position:relative;width:42px;height:23px;flex-shrink:0;}
.theme-switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
.theme-switch .slider{position:absolute;inset:0;background:var(--line);border-radius:24px;transition:.15s;pointer-events:none;}
.theme-switch .slider::before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:var(--panel);border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3);}
.theme-switch input:checked + .slider{background:var(--accent);}
.theme-switch input:checked + .slider::before{transform:translateX(19px);}
.link-btn{background:none;border:none;color:var(--accent);text-decoration:underline;font-size:.85rem;padding:0;cursor:pointer;}
.skip-link{display:block;text-align:center;font-size:.82rem;color:var(--sub);text-decoration:underline;margin-top:12px;background:none;border:none;width:100%;padding:6px;}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:608px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;font-size:.88rem;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5;}
.toast .link-btn{color:var(--accent);white-space:nowrap;}
.report-box{margin-top:12px;padding:10px 12px;background:var(--bg);border:1px dashed var(--line);border-radius:8px;}
.stat-row{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);}
.stat-row:last-child{border-bottom:none;}
.stat-nums{font-size:.76rem;color:var(--sub);}
.qline{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;}
.qline + .qline{margin-top:3px;}
.qtext{flex:1;min-width:0;white-space:pre-wrap;}
.qtext mjx-container[display="true"]:last-child{margin-bottom:0 !important;}
.qmark{flex-shrink:0;min-width:2.6em;text-align:right;font-weight:600;color:var(--sub);white-space:nowrap;}
.qgap{height:.6em;}
.grade-badge{display:flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:14px;font-weight:800;font-size:1.75rem;line-height:1;border:2px solid;flex-shrink:0;}
.grade-badge.sm{width:44px;height:44px;font-size:1.2rem;border-radius:10px;}
.grade-badge.none{color:var(--sub);border:2px dashed var(--line);font-weight:600;font-size:1.3rem;}
.q-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
.q-card-tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.85rem;}
.q-card-tags .pill{margin-left:0;}
.q-card-score{display:flex;align-items:center;gap:8px;text-align:right;font-size:.74rem;color:var(--sub);flex-shrink:0;}
.diagram{margin:14px 0 0;text-align:center;color:var(--ink);}
.diagram svg{max-width:100%;height:auto;}
.diagram figcaption{font-size:.78rem;color:var(--sub);margin-top:4px;}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%;margin:.6em 0 !important;}
.acct-bar{max-width:640px;margin:0 auto;padding:10px 16px 0;display:flex;justify-content:space-between;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:.8rem;color:var(--sub);}
.acct-bar:empty{display:none;}
.acct-bar .ok{color:var(--good);font-weight:600;}
.acct-bar .err{color:var(--bad);}
.acct-bar .link-btn{font-size:.8rem;}
.acct-who{display:flex;gap:10px;align-items:center;margin-left:auto;}
.auth-wrap{max-width:420px;margin:0 auto;padding:36px 16px 80px;}
.auth-tabs{display:flex;gap:6px;margin-bottom:12px;}
.auth-tabs button{flex:1;background:transparent;border:1px solid var(--line);color:var(--sub);font-weight:600;}
.auth-tabs button.on{border-color:var(--accent);color:var(--accent);background:var(--bg);}
input[type=email],input[type=password]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px;}
.auth-msg{font-size:.86rem;margin:4px 0 12px;line-height:1.4;}
.auth-msg.err{color:var(--bad);}
.auth-msg.ok{color:var(--good);}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.admin-tabs button{padding:9px 4px;font-size:.85rem;white-space:nowrap;}
.admin-report{padding:8px 0;border-top:1px solid var(--line);}
.admin-qid{font-size:.75rem;color:var(--sub);margin-bottom:6px;overflow-wrap:anywhere;}
.admin-qid code{font-size:.75rem;user-select:all;}
.admin-preview{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.uname-status{font-size:.8rem;min-height:1.1em;margin:-4px 0 2px;color:var(--sub);}
.uname-status.ok{color:var(--good);} .uname-status.err{color:var(--bad);}
.uname-help{font-size:.76rem;color:var(--sub);margin-bottom:4px;}
.home-hello{font-weight:700;font-size:1rem;}
.home-link{font-size:.95rem;font-weight:600;text-decoration:none;}
.home-continue-name{font-size:1.15rem;font-weight:700;margin-top:2px;}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:6px;}
.subject-card{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);min-height:74px;}
.subject-card:hover{border-color:var(--accent);}
.subject-card-text{display:flex;flex-direction:column;gap:3px;}
.subject-card-name{font-weight:700;font-size:1rem;}
.subject-card-detail{font-size:.8rem;color:var(--sub);}
.subject-card-go{font-size:1.5rem;color:var(--accent);line-height:1;}
.social-name{font-weight:600;font-size:.95rem;overflow-wrap:anywhere;}
.nav-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);vertical-align:super;}
.group-row{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:none;border-bottom:1px solid var(--line);padding:12px 2px;color:var(--ink);text-align:left;border-radius:0;}
.group-row:last-child{border-bottom:none;}
.group-row > span:first-child{display:flex;flex-direction:column;gap:2px;}
.chat-card{padding:0;overflow:hidden;}
.chat-list{height:min(55vh,460px);overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px;}
.chat-msg{max-width:85%;align-self:flex-start;}
.chat-msg.mine{align-self:flex-end;text-align:right;}
.chat-meta{font-size:.72rem;color:var(--sub);margin-bottom:2px;}
.chat-body{display:inline-block;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:.93rem;white-space:pre-wrap;overflow-wrap:anywhere;}
.chat-msg.mine .chat-body{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.chat-del{background:none;border:none;padding:0 0 0 4px;color:var(--sub);font-size:.72rem;text-decoration:underline;cursor:pointer;}
.chat-compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-end;}
.chat-compose textarea{margin:0;min-height:42px;max-height:140px;resize:vertical;}
.chat-compose .btn-primary{width:auto;flex-shrink:0;}
.chat-note{font-size:.72rem;margin:0;padding:0 12px 10px;}
.lb-row{display:grid;grid-template-columns:28px 1fr auto auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);}
.lb-row:last-child{border-bottom:none;}
.lb-row.me{background:var(--bg);border-radius:8px;}
.lb-rank{font-weight:800;color:var(--sub);text-align:center;}
.lb-name{font-weight:600;overflow-wrap:anywhere;}
.lb-num{display:flex;flex-direction:column;align-items:flex-end;font-size:.95rem;}
.lb-num span{font-size:.68rem;color:var(--sub);}
.share-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start;flex-wrap:wrap;}
.share-row:last-child{border-bottom:none;}
.tab-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));}
.tab-btn{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;padding:4px 0;color:var(--sub);font-size:.7rem;font-weight:600;border-radius:10px;}
.tab-btn.on{color:var(--accent);}
.tab-btn:focus-visible{outline:2px solid var(--accent);}
.tab-ico{position:relative;display:inline-flex;}
.tab-badge{position:absolute;top:-5px;right:-10px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:.65rem;font-weight:700;display:flex;align-items:center;justify-content:center;}
body.has-tabbar .wrap{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px));}
body.has-tabbar .toast{bottom:calc(78px + env(safe-area-inset-bottom,0px));}
.inbox-row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1px solid var(--line);padding:12px 2px;color:var(--ink);text-align:left;border-radius:0;}
.inbox-row:last-child{border-bottom:none;}
.inbox-icon{font-size:1.3rem;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.inbox-icon.avatar{border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem;}
.inbox-text{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
.new-pill{display:inline-block;background:var(--bad);color:#fff;font-size:.65rem;font-weight:700;border-radius:8px;padding:1px 6px;vertical-align:middle;}
.share-bubble{display:flex;gap:10px;align-items:center;text-align:left;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--ink);font-size:.85rem;}
.share-bubble span span{color:var(--accent);font-size:.78rem;}
.site-footer{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:26px 0 6px;font-size:.8rem;color:var(--sub);}
.site-footer a,.site-footer .link-btn{color:var(--sub);font-size:.8rem;}
.acct-name{font-size:.8rem;color:var(--sub);text-decoration:none;}
.agree-row{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;line-height:1.4;margin:6px 0 12px;cursor:pointer;}
.agree-row input{width:20px;height:20px;margin:1px 0 0;flex-shrink:0;accent-color:var(--accent);}
.link-as-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);flex:1;text-align:center;}
.help-box{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:.86rem;line-height:1.5;margin:12px 0;}
.danger-card{border-color:var(--bad);}
.danger-btn{color:var(--bad);border-color:var(--bad);}
.thread-actions{display:flex;gap:16px;justify-content:flex-end;margin:-6px 0 10px;}
.thread-actions .link-btn{font-size:.8rem;color:var(--sub);}
.safety-report{border-top:1px solid var(--line);padding:12px 0;}
.safety-report.done{opacity:.7;}
.safety-report .btn-row{flex-wrap:wrap;gap:6px;}
.safety-report .btn-ghost{flex:1 1 auto;width:auto;padding:8px 10px;font-size:.84rem;}
.snapshot{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.85rem;margin:6px 0;max-height:160px;overflow-y:auto;}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap;margin-bottom:12px;}
.seg button{background:none;border:none;border-radius:9px;padding:7px 12px;font-weight:600;font-size:.88rem;color:var(--sub);}
.seg button.on{background:var(--accent);color:var(--accent-ink);}
.calc-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 2px;}
.calc-bar .seg{margin-bottom:10px;}
.calc-bar-label{font-size:.8rem;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
.calc-pill{background:#e8f2ec;color:#1f5f3a;}
.calc-pill.non{background:#fdf0e1;color:#8a4b0c;}
:root[data-theme="dark"] .calc-pill{background:#1d3326;color:#9fe0b5;}
:root[data-theme="dark"] .calc-pill.non{background:#3a2a15;color:#f2c28a;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .calc-pill{background:#1d3326;color:#9fe0b5;} :root:not([data-theme="light"]) .calc-pill.non{background:#3a2a15;color:#f2c28a;} }
.answer-box{margin:12px 0 4px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);}
.answer-box.done{background:var(--panel);}
.ans-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.9rem;margin-bottom:8px;}
.try-dots{display:inline-flex;gap:5px;}
.try-dot{width:10px;height:10px;border-radius:50%;background:var(--line);}
.try-dot.used{background:var(--bad);}
.ans-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.ans-row input{margin:0;flex:1;font-size:1.05rem;}
.ans-input.ok{border-color:var(--good);background:var(--panel);}
.ans-prefix{min-width:auto;white-space:nowrap;font-style:italic;font-family:Georgia,serif;}
.ans-label{font-weight:700;min-width:2.2em;}
.ans-tick{color:var(--good);font-weight:800;font-size:1.2rem;}
.ans-feedback{color:var(--bad);font-weight:600;font-size:.9rem;margin:2px 0 10px;}
.ans-tools{display:inline-flex;gap:6px;flex-shrink:0;}
.ans-tool{min-width:44px;height:44px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:1.05rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.ans-tool{font-family:inherit;}
.ans-tool.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.frac-row{align-items:center;}
.frac-wrap{display:inline-flex;align-items:center;gap:8px;}
.frac-stack{display:inline-flex;flex-direction:column;align-items:center;gap:6px;}
.answer-box input.frac-in{width:84px;flex:none;text-align:center;margin:0;font-size:1.1rem;padding:8px 6px;}
.answer-box .frac-wrap > input.frac-in{width:60px;}
.frac-bar{display:block;width:100%;height:2px;background:var(--ink);border-radius:1px;}
.frac-show{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;font-size:.9em;}
.frac-show span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px;}
.ans-help{font-size:.78rem;color:var(--sub);margin-top:8px;line-height:1.45;}
.ans-result{font-weight:800;font-size:1.05rem;margin-bottom:4px;}
.ans-result.ok{color:var(--good);}
.ans-result.bad{color:var(--bad);}
.qtable-wrap{overflow-x:auto;margin:12px 0 4px;-webkit-overflow-scrolling:touch;}
.qtable{border-collapse:collapse;min-width:min(100%,280px);font-size:1rem;background:var(--panel);}
.qtable th,.qtable td{border:1.5px solid var(--ink);padding:7px 10px;text-align:center;min-width:44px;white-space:nowrap;}
.qtable th{background:var(--bg);font-weight:700;}
.qtable td.cell-blank{background:var(--panel);}
.qtable td.cell-answer{color:var(--good);font-weight:700;}
.qtable td.cell-input{padding:3px;}
.qtable input.cell-in{width:64px;min-width:52px;margin:0;padding:7px 4px;text-align:center;font-size:1rem;}
.qtable td.cell-ok{color:var(--good);font-weight:700;background:var(--panel);}
.qtable td.cell-revealed{color:var(--bad);font-weight:700;background:var(--panel);text-decoration:underline dotted;}
.ans-input.bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad);}

// ---- change tracking, so two devices can be merged without losing edits or bringing back deletions ----
function metaFix(m){
  m = m || {}; m.tomb = m.tomb || {}; m.tomb.custom = m.tomb.custom || {}; m.tomb.reports = m.tomb.reports || {}; m.tomb.decks = m.tomb.decks || {};

function metaSave(m){ try{ localStorage.setItem(META_KEY, JSON.stringify(m)); }catch(e){} }
function reportKey(r){ return String(r.id) + "|" + r.ts; }
function flatCustom(c){ const out = {}; (c||[]).forEach(t=>(t.questions||[]).forEach(q=>{ out[q.id] = q; })); return out; }
function trackCustomChanges(oldC, newC){
  const m = metaLoad(), now = Date.now(), a = flatCustom(oldC), b = flatCustom(newC);
  Object.keys(a).forEach(id=>{ if(!b[id]) m.tomb.custom[id] = now; });
  Object.keys(b).forEach(id=>{ if(!a[id] || JSON.stringify(a[id])!==JSON.stringify(b[id])){ m.stamp.custom[id] = now; delete m.tomb.custom[id]; } });
  metaSave(m);
}
function trackAttemptChanges(oldA, newA){
  const old = {}; (oldA||[]).forEach(a=>{ old[a.id] = a; });
  const m = metaLoad(), now = Date.now(); let changed = false;
  (newA||[]).forEach(a=>{ const o = old[a.id]; if(o && o.rating!==a.rating){ m.stamp.attempts[a.id] = now; changed = true; } });
  if(changed) metaSave(m);
}
function trackReportChanges(oldR, newR){
  const keep = new Set((newR||[]).map(reportKey)), m = metaLoad(), now = Date.now(); let changed = false;
  (oldR||[]).forEach(r=>{ const k = reportKey(r); if(!keep.has(k)){ m.tomb.reports[k] = now; changed = true; } });
  if(changed) metaSave(m);
}
function trackDeckChanges(oldD, newD){

  Object.keys(a).forEach(id=>{ if(!b[id]) m.tomb.decks[id] = now; });

}

// ---- merging ----
function localBlob(){
  return { progress:loadJSON(PROGRESS_KEY,{}), qstate:loadJSON(QSTATE_KEY,{}), attempts:loadJSON(ATTEMPTS_KEY,[]),
           custom:loadJSON(CUSTOM_KEY,[]), reports:loadJSON(REPORTS_KEY,[]), decks:loadJSON(DECKS_KEY,[]), shop:loadJSON(SHOP_KEY,{}), meta:metaLoad() };
}
function localHasData(){
  const b = localBlob();
  return b.attempts.length>0 || b.custom.length>0 || b.decks.length>0 || b.reports.length>0 || Object.keys(b.qstate).length>0 || Object.keys(b.progress).length>0;
}
function clearLocalData(){ [PROGRESS_KEY, CUSTOM_KEY, QSTATE_KEY, REPORTS_KEY, ATTEMPTS_KEY, DECKS_KEY, SHOP_KEY, META_KEY, REPORT_QUEUE_KEY, USERNAME_KEY, WALLET_KEY, AWARD_QUEUE_KEY, INBOX_SEEN_KEY].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} }); }
function maxMap(a, b){ const o = {...(a||{})}; for(const k in (b||{})) o[k] = Math.max(o[k]||0, b[k]||0); return o; }
function deriveProgress(attempts){
  const by = {};
  attempts.forEach(a=>{
    const key = topicKey(a.subject, a.topic);
    const s = by[key] || (by[key] = {seen:0, correct:0, silly:0, wrong:0, possibleMarks:0, earnedPoints:0});
    const marks = a.marks||1;
    s.seen++;
    if(a.rating==="correct") s.correct++; else if(a.rating==="silly") s.silly++; else s.wrong++;
    s.possibleMarks += marks; s.earnedPoints += ratingDelta(a.rating, a.hints, marks);
  });
  return by;
}
function mergeBlobs(L, R){
  L = L || {}; R = R || {};
  const lm = metaFix(L.meta), rm = metaFix(R.meta);
  const meta = { owner:lm.owner, resetAt:Math.max(lm.resetAt, rm.resetAt),
    tomb:{ custom:maxMap(lm.tomb.custom, rm.tomb.custom), reports:maxMap(lm.tomb.reports, rm.tomb.reports), decks:maxMap(lm.tomb.decks, rm.tomb.decks) },
    stamp:{ custom:maxMap(lm.stamp.custom, rm.stamp.custom), attempts:maxMap(lm.stamp.attempts, rm.stamp.attempts), decks:maxMap(lm.stamp.decks, rm.stamp.decks) } };

  const am = {};
  (R.attempts||[]).forEach(a=>{ am[a.id] = {a, s:rm.stamp.attempts[a.id]||0}; });
  (L.attempts||[]).forEach(a=>{ const s = lm.stamp.attempts[a.id]||0; if(!am[a.id] || s>=am[a.id].s) am[a.id] = {a, s}; });
  const attempts = Object.values(am).map(x=>x.a).filter(a=>(a.ts||0)>=meta.resetAt).sort((x,y)=>(x.ts||0)-(y.ts||0));

  const qstate = {}, lq = L.qstate||{}, rq = R.qstate||{};
  new Set([...Object.keys(lq), ...Object.keys(rq)]).forEach(id=>{
    const a = lq[id], b = rq[id];
    const w = !b ? a : !a ? b : ((a.t||0)>=(b.t||0) ? a : b);
    if(meta.resetAt && (w.t||0)<meta.resetAt) return;
    qstate[id] = w;
  });

  const progress = deriveProgress(attempts);
  if(!meta.resetAt){
    const lp = L.progress||{}, rp = R.progress||{};
    new Set([...Object.keys(lp), ...Object.keys(rp)]).forEach(t=>{
      if(progress[t]) return;
      const a = lp[t], b = rp[t];
      progress[t] = !b ? a : !a ? b : ((a.seen||0)>=(b.seen||0) ? a : b);
    });
  }

  const cm = {}, order = [], cats = {};
  const ckey = t=>((t && t.subject) || "alevel-maths") + "|" + t.topic;
  const addSide = (c, stamps, isLocal)=>{
    (c||[]).forEach(t=>{
      const k = ckey(t);
      if(!order.includes(k)) order.push(k);
      if(!cats[k] || isLocal) cats[k] = {topic:t.topic, category:t.category, subject:t.subject};
      (t.questions||[]).forEach(q=>{
        const s = stamps[q.id]||0, cur = cm[q.id];
        if(!cur || (isLocal ? s>=cur.s : s>cur.s)) cm[q.id] = {q, key:k, s};
      });
    });
  };
  addSide(L.custom, lm.stamp.custom, true);
  addSide(R.custom, rm.stamp.custom, false);
  const byTopic = {};
  Object.entries(cm).forEach(([id, x])=>{
    const dead = meta.tomb.custom[id];
    if(dead && dead>=(meta.stamp.custom[id]||0)) return;
    (byTopic[x.key] = byTopic[x.key] || []).push(x.q);
  });
  const custom = order.filter(k=>byTopic[k] && byTopic[k].length).map(k=>{
    const c = cats[k], e = {topic:c.topic, category:c.category, questions:byTopic[k]};
    if(c.subject) e.subject = c.subject;
    return e;
  });

  const rmap = {};
  [...(R.reports||[]), ...(L.reports||[])].forEach(r=>{ const k = reportKey(r); if(!meta.tomb.reports[k]) rmap[k] = r; });
  const reports = Object.values(rmap).sort((x,y)=>(x.ts||0)-(y.ts||0));

  const dm = {}, dOrder = [];
  (L.decks||[]).forEach(d=>{ dOrder.push(d.id); dm[d.id] = {d, s:lm.stamp.decks[d.id]||0}; });
  (R.decks||[]).forEach(d=>{ const s = rm.stamp.decks[d.id]||0; if(!dm[d.id]){ dOrder.push(d.id); dm[d.id] = {d, s}; } else if(s>dm[d.id].s) dm[d.id] = {d, s}; });
  const decks = dOrder.filter(id=>{ const dead = meta.tomb.decks[id]; return !(dead && dead>=(meta.stamp.decks[id]||0)); }).map(id=>dm[id].d);

  const ls = L.shop||{}, rs = R.shop||{};
  const la = ls.active||{t:0}, ra = rs.active||{t:0};
  const shop = { active:(la.t||0)>=(ra.t||0) ? la : ra };
  if(!shop.active.id) shop.active = {id:"classic", t:0};

  return { progress, qstate, attempts, custom, reports, decks, shop, meta };
}
function writeLocal(b){
  applyingRemote = true;
  try{
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(b.progress));
    localStorage.setItem(QSTATE_KEY, JSON.stringify(b.qstate));
    localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(b.attempts));
    localStorage.setItem(CUSTOM_KEY, JSON.stringify(b.custom));
    localStorage.setItem(REPORTS_KEY, JSON.stringify(b.reports));
    localStorage.setItem(DECKS_KEY, JSON.stringify(b.decks||[]));
    localStorage.setItem(SHOP_KEY, JSON.stringify(b.shop||{}));

function forCloud(b){ const meta = {...b.meta}; delete meta.owner; return {...b, meta}; }
function sameData(a, b){ return JSON.stringify(forCloud(a))===JSON.stringify(forCloud(b)); }

// ---- syncing ----
function cloudSchedule(){
  if(applyingRemote || !user) return;
  setBar("saving");
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 1500);
}
async function syncNow(){
  if(!user || !sb) return false;
  clearTimeout(syncTimer);
  if(syncing){ syncAgain = true; return false; }
  syncing = true;
  try{
    const res = await sb.from("progress").select("data").eq("user_id", user.id).maybeSingle();
    if(res.error) throw res.error;
    const before = localBlob();
    const merged = mergeBlobs(before, res.data && res.data.data ? res.data.data : {});
    const changed = !sameData(merged, before);
    if(changed) writeLocal(merged);
    const up = await sb.from("progress").upsert({ user_id:user.id, data:forCloud(merged), updated_at:new Date().toISOString() });
    if(up.error) throw up.error;
    lastSyncOk = true;
    setBar("saved");
    flushReports();
    flushAwards();
    if(changed) refreshApp();
  }catch(e){
    lastSyncOk = false;
    setBar(navigator.onLine===false ? "offline" : "error");
    console.error("Sync failed:", e);
  }finally{
    syncing = false;
    if(syncAgain){ syncAgain = false; syncNow(); }
  }
  return lastSyncOk;
}

function setBar(status){

    unavailable:`<span class="err">Log in isn't available right now. Progress is saving on this device.</span>`
  };
  let right = "";
  if(user) right = `<span class="acct-who"><button class="link-btn acct-name" data-go-account title="Your account">${user.username ? "@"+esc(user.username) : esc(user.email||"")}</button><button class="link-btn" id="logoutBtn">Log out</button></span>`;
  else if(barStatus==="guest") right = `<button class="link-btn" id="showLoginBtn">Log in or create account</button>`;
  el.innerHTML = `<div class="acct-status">${msgs[barStatus]||""}</div>${right}`;
  const lo = document.getElementById("logoutBtn"); if(lo) lo.onclick = logOut;
  const sl = document.getElementById("showLoginBtn"); if(sl) sl.onclick = ()=>showAuth("login");
  const rt = document.getElementById("retrySyncBtn"); if(rt) rt.onclick = ()=>{ setBar("saving"); syncNow(); };
}

function showAuth(mode, msg, cls){
  authMode = mode;

  const un = document.getElementById("authUser"); const keepUser = un ? un.value : "";

  el.innerHTML = authHtml(mode, msg, cls);
  if(typeof updateTabBar==="function") updateTabBar();
  const e2 = document.getElementById("authEmail"); if(e2 && keepEmail) e2.value = keepEmail;
  const u2 = document.getElementById("authUser"); if(u2 && keepUser) u2.value = keepUser;
  const p2 = document.getElementById("authPass"); if(p2 && keepPass) p2.value = keepPass;
  const a2 = document.getElementById("authAgree"); if(a2 && keepAgree) a2.checked = true;

function hideAuth(){
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("authScreen").innerHTML = "";

  render();
}
function authBusy(on){ const b = document.getElementById("authGo"); if(b){ b.disabled = on; b.style.opacity = on ? .6 : 1; } }
function friendlyAuthError(err){
  const t = String(err && err.message || err || "");
  if(/invalid login credentials/i.test(t)) return "That email and password don't match an account.";
  if(/email not confirmed/i.test(t)) return "Confirm your email first. Check your inbox for the link, then log in.";
  if(/already registered|already exists/i.test(t)) return "There's already an account with this email. Log in instead.";
  if(/rate limit|too many/i.test(t)) return "Too many attempts. Wait a few minutes and try again.";
  if(/username_available|profiles/i.test(t)) return "Usernames aren't set up on the server yet. Run the username SQL in Supabase.";
  if(/failed to fetch|network/i.test(t)) return "Couldn't connect. Check your internet connection and try again.";
  if(/password/i.test(t) && /(6|characters|short|weak)/i.test(t)) return "Choose a longer password (at least 6 characters).";
  return t || "Something went wrong. Try again.";
}
function attachAuth(){
  const g = (id)=>document.getElementById(id);
  if(g("tabLogin")) g("tabLogin").onclick = ()=>showAuth("login");
  if(g("tabSignup")) g("tabSignup").onclick = ()=>showAuth("signup");
  if(g("authForgot")) g("authForgot").onclick = ()=>showAuth("forgot");
  if(g("authBack")) g("authBack").onclick = ()=>showAuth("login");
  if(g("authLogout")) g("authLogout").onclick = logOut;
  if(g("authUnder13")) g("authUnder13").onclick = async ()=>{
    alert("Sorry, accounts are only for people aged 13 and over. You can still practise without an account: your progress will be saved on this device.");
    await logOut();
  };
  watchUsernameField();
  if(g("authGuest")) g("authGuest").onclick = ()=>{ localStorage.setItem(GUEST_KEY, "1"); hideAuth(); setBar("guest"); };
  const f = g("authForm");
  if(f) f.onsubmit = async (ev)=>{
    ev.preventDefault();
    const email = g("authEmail") ? g("authEmail").value.trim() : "";
    const pass = g("authPass") ? g("authPass").value : "";
    const uname = g("authUser") ? g("authUser").value.trim() : "";
    if((authMode==="signup" || authMode==="username") && usernameProblem(uname)) return showAuth(authMode, usernameProblem(uname));
    if(!["newpass","username","terms"].includes(authMode) && !/^\S+@\S+\.\S+$/.test(email)) return showAuth(authMode, "Enter a valid email address.");
    authBusy(true);
    try{
      if(authMode==="login"){
        const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
        if(error) throw error;
        await afterLogin(data.user, false);
      }else if(authMode==="signup"){
        if(pass.length<6) return showAuth("signup", "Choose a longer password (at least 6 characters).");
        if(!(await usernameAvailable(uname))) return showAuth("signup", `“${uname}” is taken. Try another username.`);
        if(!g("authAgree") || !g("authAgree").checked) return showAuth("signup", "Please confirm you're 13 or older and agree to the rules.");
        const opts = { data:{ username:uname, terms_version:TERMS_VERSION, age_13_plus:true }, ...(isHosted() ? { emailRedirectTo:herePage() } : {}) };
        const { data, error } = await sb.auth.signUp({ email, password:pass, options:opts });
        if(error) throw error;
        if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0)
          return showAuth("login", "There's already an account with this email. Log in instead.");
        if(data.session) await afterLogin(data.user, true);
        else{
          localStorage.setItem(PENDING_KEY, email.toLowerCase());
          showAuth("login", "Account created. Check your email for a confirmation link, then log in.", "ok");
        }
      }else if(authMode==="terms"){
        if(!g("authAgree").checked) return showAuth("terms", "Please tick the box to carry on.");
        const uname2 = user.username;
        const { data, error } = await sb.auth.updateUser({ data:{ terms_version:TERMS_VERSION, age_13_plus:true } });
        if(error) throw error;
        if(data && data.user){ user = data.user; if(uname2) user.username = uname2; }
        await finishLogin();
      }else if(authMode==="username"){
        const r = await claimUsername(uname);
        if(r==="taken") return showAuth("username", `“${uname}” is taken. Try another username.`);
        await finishLogin();
      }else if(authMode==="forgot"){
        if(!isHosted()) return showAuth("forgot", "Password reset only works once the site is online at a web address, not from a downloaded file.");
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo:herePage() });
        if(error) throw error;
        showAuth("forgot", "If there's an account for that email, a reset link is on its way. Check your inbox.", "ok");
      }else if(authMode==="newpass"){
        if(pass.length<6) return showAuth("newpass", "Choose a longer password (at least 6 characters).");
        if(pass!==g("authPass2").value) return showAuth("newpass", "The two passwords don't match.");
        const { data, error } = await sb.auth.updateUser({ password:pass });
        if(error) throw error;
        cleanUrl();
        await afterLogin(data.user, false);
      }
    }catch(err){
      showAuth(authMode, friendlyAuthError(err));
    }finally{ authBusy(false); }
  };
}
function cleanUrl(){ if(location.hash || /[?&](code|error)=/.test(location.search)) history.replaceState(null, "", location.pathname); }


// ---- usernames ----
const USERNAME_KEY = "alevel_maths_username_v1";
const USERNAME_RE = /^[A-Za-z0-9_]{3,20}$/;
function usernameProblem(name){
  if(!name) return "Choose a username.";
  if(name.length<3) return "Usernames need at least 3 characters.";
  if(name.length>20) return "Usernames can be at most 20 characters.";
  if(!USERNAME_RE.test(name)) return "Use only letters, numbers and underscores (no spaces).";
  return "";
}
function cachedUsername(){ try{ const c = JSON.parse(localStorage.getItem(USERNAME_KEY)); return c && user && c.uid===user.id ? c.name : ""; }catch(e){ return ""; } }
function cacheUsername(name){ try{ localStorage.setItem(USERNAME_KEY, JSON.stringify({uid:user.id, name})); }catch(e){} user.username = name; }
async function usernameAvailable(name){
  const { data, error } = await sb.rpc("username_available", { name });
  if(error) throw error;
  return !!data;
}
async function claimUsername(name){
  const { error } = await sb.from("profiles").insert({ user_id:user.id, username:name });
  if(error){
    if(error.code==="23505" || /duplicate|unique/i.test(error.message||"")) return "taken";
    throw error;
  }
  cacheUsername(name);
  return "ok";
}
// Returns true when the account has a username (or we can't check right now), false if one must be chosen.
async function ensureUsername(){
  try{
    const { data, error } = await sb.from("profiles").select("username").eq("user_id", user.id).maybeSingle();
    if(error) throw error;
    if(data && data.username){ cacheUsername(data.username); return true; }
    const wanted = (user.user_metadata && user.user_metadata.username) || "";
    if(wanted && !usernameProblem(wanted)){
      const r = await claimUsername(wanted);
      if(r==="ok") return true;
      pendingUsernameMsg = `Sorry, “${wanted}” was taken by someone else before your account was confirmed. Choose another.`;
    }
    return false;
  }catch(e){
    const c = cachedUsername(); if(c) user.username = c;
    return true; // offline or temporary error: don't lock the person out
  }
}
let pendingUsernameMsg = "";
async function finishLogin(){
  const ok = await ensureUsername();
  if(!ok){ showAuth("username", pendingUsernameMsg, pendingUsernameMsg ? "err" : ""); pendingUsernameMsg = ""; return; }
  if(!termsAccepted()){ showAuth("terms"); return; }
  state.screen = "home"; document.title = SITE_NAME;
  applyShopTheme();
  hideAuth();
  setBar("saving");
  checkAdmin();
  refreshWallet();
  loadSocial();
  loadInbox();
  startInboxPolling();
  await syncNow();
}
let unameTimer = null;
function watchUsernameField(){
  const f = document.getElementById("authUser"), out = document.getElementById("unameStatus");
  if(!f || !out) return;
  f.oninput = ()=>{
    clearTimeout(unameTimer);
    const name = f.value.trim();
    const prob = usernameProblem(name);
    if(!name){ out.textContent = ""; return; }
    if(prob){ out.textContent = prob; out.className = "uname-status err"; return; }
    out.textContent = "Checking…"; out.className = "uname-status";
    unameTimer = setTimeout(async ()=>{
      try{
        const free = await usernameAvailable(name);
        if(f.value.trim()!==name) return;
        out.textContent = free ? `✓ ${name} is available` : `${name} is taken. Try another.`;
        out.className = "uname-status " + (free ? "ok" : "err");
      }catch(e){ out.textContent = ""; }
    }, 400);
  };
}
async function afterLogin(u, isNew){
  if(!u) return;
  const m = metaLoad();
  const pending = localStorage.getItem(PENDING_KEY);
  const justConfirmed = pending && u.email && pending===u.email.toLowerCase();
  if(m.owner!==u.id && localHasData() && !isNew && !justConfirmed){
    const add = confirm("This browser has practice progress that isn't saved to your account.\n\nOK: add it to your account\nCancel: discard it and load your account's progress");
    if(!add) clearLocalData();
  }else if(m.owner && m.owner!==u.id){
    clearLocalData();
  }
  const m2 = metaLoad(); m2.owner = u.id; metaSave(m2);
  localStorage.removeItem(GUEST_KEY);
  localStorage.removeItem(PENDING_KEY);
  user = u;
  await finishLogin();
}
async function logOut(){
  if(user){
    setBar("saving");
    const ok = await syncNow();
    if(!ok && !confirm("Your latest progress hasn't reached your account yet (you may be offline). Log out anyway and lose it?")) return;
  }
  try{ await sb.auth.signOut(); }catch(e){}
  clearLocalData();
  localStorage.removeItem(GUEST_KEY);
  location.reload();
}

function initAccounts(){
  if(!accountsEnabled()) return;
  if(!window.supabase || !window.supabase.createClient){ setBar("unavailable"); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
  const hash = location.hash + location.search;
  const recovery = /type=recovery/.test(hash);
  const linkError = (hash.match(/error_description=([^&]+)/)||[])[1];
  const guest = localStorage.getItem(GUEST_KEY)==="1";
  if(!guest || recovery){ document.getElementById("app").style.display = "none"; setBar("loading"); }
  let inRecovery = recovery;
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==="PASSWORD_RECOVERY"){ inRecovery = true; setTimeout(()=>showAuth("newpass"), 0); }
  });
  sb.auth.getSession().then(({ data })=>{
    const s = data && data.session;
    if(linkError){
      cleanUrl();
      return showAuth(recovery ? "forgot" : "login", "That link has expired or was already used. " + (recovery ? "Send a new reset link." : "Log in, or request a new link."));
    }
    if(inRecovery){ if(s) return showAuth("newpass"); return showAuth("forgot", "That reset link has expired. Send a new one."); }
    cleanUrl();
    if(s) afterLogin(s.user, false);
    else if(guest){ document.getElementById("app").style.display = ""; setBar("guest"); }
    else showAuth("login");
  }).catch(()=>{ document.getElementById("app").style.display = ""; setBar("unavailable"); });
  window.addEventListener("online", ()=>{ if(user) syncNow(); });
  document.addEventListener("visibilitychange", ()=>{ if(user && document.visibilityState==="visible") syncNow(); });
}

// ================= Question reports + admin screen =================
const REPORT_QUEUE_KEY = "alevel_maths_report_queue_v1";
let isAdmin = false, adminOpenCount = 0;
const admin = { status:"open", loading:false, error:"", reports:[], expanded:{} };

// Reports are queued on the device and sent when the person is logged in and online.
function queueReport(r){
  const q = loadJSON(REPORT_QUEUE_KEY, []);
  q.push(r);
  try{ localStorage.setItem(REPORT_QUEUE_KEY, JSON.stringify(q)); }catch(e){}
  flushReports();
}
let flushingReports = false;
async function flushReports(){
  if(!user || !sb || flushingReports) return;
  const q = loadJSON(REPORT_QUEUE_KEY, []);
  if(!q.length) return;
  flushingReports = true;
  try{
    const rows = q.map(r=>({ question_id:String(r.id), topic:String(r.topic||"").slice(0,200), prompt_snippet:String(r.prompt||"").slice(0,300),
                             reason:String(r.reason||"").slice(0,100), comment:String(r.comment||"").slice(0,2000), user_id:user.id }));
    const { error } = await sb.from("reports").insert(rows);
    if(!error){
      const now = loadJSON(REPORT_QUEUE_KEY, []);
      try{ localStorage.setItem(REPORT_QUEUE_KEY, JSON.stringify(now.slice(q.length))); }catch(e){}
    }else console.error("Report upload failed:", error);
  }catch(e){ console.error("Report upload failed:", e); }
  finally{ flushingReports = false; }
}

async function checkAdmin(){
  isAdmin = false;
  if(!user || !sb) return;
  try{
    const { data } = await sb.from("admins").select("user_id").eq("user_id", user.id).maybeSingle();
    isAdmin = !!data;
    if(isAdmin) await refreshAdminCount();
  }catch(e){}
  if((state.screen==="select" || state.screen==="home") && document.getElementById("app").style.display!=="none") render();
}
async function refreshAdminCount(){
  try{
    const { count } = await sb.from("reports").select("id", { count:"exact", head:true }).eq("status", "open");
    adminOpenCount = count || 0;
  }catch(e){}
}
async function loadAdminReports(){
  admin.loading = true; admin.error = ""; render();
  try{
    let q = sb.from("reports").select("*");
    if(admin.status!=="all") q = q.eq("status", admin.status);
    const { data, error } = await q.order("created_at", { ascending:false }).limit(1000);
    if(error) throw error;
    admin.reports = data || [];
    const ids = [...new Set(admin.reports.map(r=>r.user_id).filter(Boolean))];
    admin.names = {};
    if(ids.length){
      const pr = await sb.from("profiles").select("user_id,username").in("user_id", ids);
      (pr.data||[]).forEach(p=>{ admin.names[p.user_id] = p.username; });
    }
  }catch(e){
    admin.error = "Couldn't load reports. Check your connection and try again.";
  }
  admin.loading = false;
  await refreshAdminCount();
  await refreshCatalogCount();
  await loadSafetyReports();
  if(state.screen==="admin") render();
}
async function adminAct(ids, action){
  if(!ids.length) return;
  let res;
  if(action==="delete"){
    if(!confirm(ids.length===1 ? "Delete this report permanently?" : `Delete these ${ids.length} reports permanently?`)) return;
    res = await sb.from("reports").delete().in("id", ids);
  }else{
    const patch = { status:action, resolved_at: action==="open" ? null : new Date().toISOString() };
    res = await sb.from("reports").update(patch).in("id", ids);
  }
  if(res && res.error){ alert("That didn't save. Check your connection and try again."); return; }
  const done = { fixed:"Marked as fixed.", dismissed:"Dismissed.", open:"Reopened.", delete:"Deleted." }[action];
  state.toast = { message:done, showUndo:false };
  await loadAdminReports();
  setTimeout(()=>{ state.toast = null; if(state.screen==="admin") render(); }, 3000);
}
function findQuestion(id){
  let found = null;
  getEveryTopic().forEach(t=>t.questions.forEach(q=>{ if(q.id===id && !found) found = {...q, topic:t.topic}; }));
  return found;
}
function renderAdmin(){
  const tabs = [["open","Open"],["fixed","Fixed"],["dismissed","Dismissed"],["all","All"]]
    .map(([k,l])=>`<button type="button" data-admin-tab="${k}" class="${admin.status===k?"on":""}">${l}${k==="open"&&adminOpenCount?` (${adminOpenCount})`:""}</button>`).join("");

  else if(!admin.reports.length) body = `<div class="card"><div class="sub" style="margin:0;">${admin.status==="open" ? "No open reports. Everything's been dealt with." : "Nothing here."}</div></div>`;
  else{
    const groups = {};
    admin.reports.forEach(r=>{ (groups[r.question_id] = groups[r.question_id] || []).push(r); });
    const nQ = Object.keys(groups).length;
    body = `<div class="sub">${nQ} question${nQ===1?"":"s"}, ${admin.reports.length} report${admin.reports.length===1?"":"s"}. Most reported first.</div>` +
      Object.entries(groups).sort((a,b)=>b[1].length-a[1].length).map(([qid, rs])=>{
        const q = findQuestion(qid);
        const ids = rs.map(r=>r.id).join(",");
        const open = !!admin.expanded[qid];
        const list = rs.map(r=>`
          <div class="admin-report">
            <div class="qlist-topic"><strong>${esc(r.reason||"Other")}</strong> · ${new Date(r.created_at).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}${admin.names && admin.names[r.user_id] ? ` · @${esc(admin.names[r.user_id])}` : ""}${admin.status==="all"?` <span class="pill">${esc(r.status)}</span>`:""}</div>
            ${r.comment ? `<div class="qlist-text">${esc(r.comment)}</div>` : `<div class="qlist-text" style="color:var(--sub);">No details given.</div>`}
          </div>`).join("");
        const preview = !open ? "" : q ? `
          <div class="admin-preview">
            <div class="qprompt">${fmtPrompt(q.prompt)}</div>${diagramHtml(q, "answers")}
            ${(q.hints||[]).map((h,i)=>`<div class="hintbox"><strong>Hint ${i+1}:</strong> ${esc(h)}</div>`).join("")}
            ${answerSpec(q) ? `<div class="qlist-topic">Accepted answers: ${q.roots ? `${esc(q.variable||"x")} = ${q.roots.map(esc).join(", ")} (any order)` : answerSpec(q).map(p=>`${p.label?`(${esc(p.label)}) `:""}${p.answers.map(esc).join(" / ")}`).join(" · ")}${q.exact ? " (exact)" : ""}</div>` : ""}
            <div class="solbox"><strong>Solution:</strong> ${solutionHtml(q.solution)}</div>
          </div>` : `<div class="hintbox">This question isn't in the site's question bank. It was probably one the reporter added themselves in Manage. What they reported: “${esc(rs[0].prompt_snippet||"")}”</div>`;
        const acts = admin.status==="open"
          ? `<button class="btn-ghost" data-admin-act="fixed" data-ids="${ids}">Mark fixed</button><button class="btn-ghost" data-admin-act="dismissed" data-ids="${ids}">Dismiss</button>`
          : `<button class="btn-ghost" data-admin-act="open" data-ids="${ids}">Reopen</button>`;
        return `<div class="card">
          <div class="q-card-head">
            <div class="q-card-tags"><strong>${esc(q ? q.topic : (rs[0].topic||"Unknown topic"))}</strong><span class="pill">${rs.length} report${rs.length===1?"":"s"}</span>${q?`<span class="pill">${q.marks||1} marks</span>`:""}</div>
          </div>
          <div class="qlist-text" style="margin-bottom:8px;">${snip(q ? q.prompt : rs[0].prompt_snippet, 140)}</div>
          <div class="admin-qid">Question ID: <code>${esc(qid)}</code></div>
          ${list}
          ${preview}
          <div class="btn-row">
            <button class="btn-ghost" data-admin-toggle="${esc(qid)}">${open ? "Hide question" : "Show question"}</button>
            ${acts}
          </div>
          <button class="skip-link" data-admin-act="delete" data-ids="${ids}" style="text-align:right;">Delete ${rs.length===1?"report":"reports"}</button>
        </div>`;
      }).join("");
  }
  return `
    <div class="toprow"><h2>Admin</h2><button class="link-btn" id="backSelectBtn">Back</button></div>
    ${renderSafetyQueue()}
    <div class="card"><h2 style="font-size:1rem;">Coins</h2>
      <div class="sub" style="margin:0 0 10px;">Questions only earn coins once the server knows about them. ${admin.catalogCount===null||admin.catalogCount===undefined ? "" : `The server knows <strong>${admin.catalogCount}</strong> question${admin.catalogCount===1?"":"s"}; the site has <strong>${siteQuestionItems().length}</strong>.`} Press this after uploading new or changed question files.</div>
      <button class="btn-ghost" id="syncCatalogBtn">Update coin question list</button>
    </div>
    <h3>Reported questions</h3>
    <div class="auth-tabs admin-tabs">${tabs}</div>
    <div style="margin-bottom:12px;"><button class="link-btn" id="adminRefreshBtn">Refresh</button></div>
    ${body}`;
}
const SAFETY_KIND = { group_message:"Group message", direct_message:"Private message", group_share:"Shared item", user:"User" };
async function loadSafetyReports(){
  try{ admin.safety = await rpc("admin_list_content_reports", { p_status: admin.safetyAll ? "all" : "open" }) || []; admin.safetyError = ""; }
  catch(e){ admin.safety = []; admin.safetyError = socialErr(e).replace("social-and-coins-setup.sql", "safety-and-privacy-setup.sql"); }
}
function renderSafetyQueue(){
  const list = admin.safety || [];
  const open = list.filter(r=>r.status==="open").length;
  const rows = list.map(r=>{
    const urgent = /risk of harm|sexual|threat/i.test(r.reason);
    return `<div class="safety-report${r.status!=="open" ? " done" : ""}">
      <div class="qlist-topic"><strong>${esc(r.reason)}</strong>${urgent && r.status==="open" ? ` <span class="new-pill">Check first</span>` : ""} · ${SAFETY_KIND[r.kind]||r.kind}${r.group_name ? ` in ${esc(r.group_name)}` : ""} · ${fmtWhen(r.created_at)}${r.status!=="open" ? ` · <span class="pill">${esc(r.status)}</span>` : ""}</div>
      <div class="qlist-text">Reported: <strong>@${esc(r.reported_username||"deleted account")}</strong>${r.reported_banned ? ` <span class="pill">Banned</span>` : ""} · by @${esc(r.reporter_name||"deleted account")}</div>
      ${r.snapshot ? `<div class="snapshot">${esc(String(r.snapshot).slice(0,800))}</div>` : ""}
      ${r.details ? `<div class="qlist-text"><em>Reporter says:</em> ${esc(r.details)}</div>` : ""}
      <div class="btn-row">
        ${r.status==="open" && r.kind!=="user" ? `<button class="btn-ghost" data-sr-remove="${r.id}">Remove it</button>` : ""}
        ${r.reported_user ? `<button class="btn-ghost" data-sr-ban="${esc(r.reported_user)}" data-sr-banned="${r.reported_banned?1:0}" data-sr-name="${esc(r.reported_username||"")}">${r.reported_banned ? "Unban" : "Ban from social features"}</button>` : ""}
        ${r.status==="open" ? `<button class="btn-ghost" data-sr-status="${r.id}" data-sr-to="actioned">Mark handled</button><button class="btn-ghost" data-sr-status="${r.id}" data-sr-to="dismissed">Dismiss</button>` : `<button class="btn-ghost" data-sr-status="${r.id}" data-sr-to="open">Reopen</button>`}
      </div>
    </div>`;
  }).join("");
  return `<div class="card"><h2 style="font-size:1rem;">Safety reports${open ? ` (${open} open)` : ""}</h2>
    ${admin.safetyError ? `<div class="auth-msg err">${esc(admin.safetyError)}</div>` : ""}
    ${rows || `<div class="sub" style="margin:0;">${admin.safetyAll ? "No safety reports yet." : "No open safety reports."}</div>`}
    <button class="link-btn" id="safetyToggleBtn" style="margin-top:8px;">${admin.safetyAll ? "Show open reports only" : "Show handled reports too"}</button>
  </div>`;
}
async function safetyAction(fn, args, msg){
  try{ await rpc(fn, args); state.toast = { message:msg, showUndo:false }; }
  catch(e){ state.toast = { message:socialErr(e), showUndo:false }; }
  await loadSafetyReports(); render();
  setTimeout(()=>{ state.toast = null; if(state.screen==="admin") render(); }, 2500);
}
function siteQuestionItems(){
  const out = [];
  SUBJECTS.forEach(sb2=>(SUBJECT_BANKS[sb2.id]||[]).forEach(t=>(t.questions||[]).forEach(q=>out.push({ id:q.id, subject:sb2.id, marks:Math.max(1, parseInt(q.marks)||1) }))));
  return out;
}
async function refreshCatalogCount(){
  try{ const { count } = await sb.from("question_catalog").select("id", { count:"exact", head:true }); admin.catalogCount = count||0; }
  catch(e){ admin.catalogCount = null; }
}
async function syncCatalog(btn){
  btn.disabled = true; btn.textContent = "Updating…";
  try{
    await loadAllSubjects();
    const items = siteQuestionItems();
    for(let i=0; i<items.length; i+=500){ const r = await sb.rpc("admin_sync_catalog", { p_items:items.slice(i, i+500) }); if(r.error) throw r.error; }
    await refreshCatalogCount();
    state.toast = { message:`Coin list updated: ${items.length} questions.`, showUndo:false };
  }catch(e){
    state.toast = { message: /does not exist|could not find/i.test(e.message||"") ? "Run social-and-coins-setup.sql in Supabase first." : "Couldn't update the coin list. Try again.", showUndo:false };
  }
  render();
  setTimeout(()=>{ state.toast = null; if(state.screen==="admin") render(); }, 3000);
}
function attachAdminHandlers(){
  const ab = document.getElementById("adminBtn");
  if(ab) ab.onclick = ()=>{ state.backTo = state.screen; state.screen = "admin"; admin.expanded = {}; loadAdminReports(); window.scrollTo(0,0); };
  if(state.screen!=="admin") return;
  document.querySelectorAll("[data-admin-tab]").forEach(b=>{ b.onclick = ()=>{ admin.status = b.dataset.adminTab; admin.expanded = {}; loadAdminReports(); }; });
  const rf = document.getElementById("adminRefreshBtn"); if(rf) rf.onclick = loadAdminReports;
  const sc = document.getElementById("syncCatalogBtn"); if(sc) sc.onclick = ()=>syncCatalog(sc);
  const st = document.getElementById("safetyToggleBtn"); if(st) st.onclick = async ()=>{ admin.safetyAll = !admin.safetyAll; await loadSafetyReports(); render(); };
  document.querySelectorAll("[data-sr-remove]").forEach(b=>{ b.onclick = ()=>{ if(confirm("Delete the reported content for everyone? A copy stays in this report.")) safetyAction("admin_remove_reported_content", { p_id:Number(b.dataset.srRemove) }, "Removed."); }; });
  document.querySelectorAll("[data-sr-status]").forEach(b=>{ b.onclick = ()=>safetyAction("admin_resolve_report", { p_id:Number(b.dataset.srStatus), p_status:b.dataset.srTo }, "Updated."); });
  document.querySelectorAll("[data-sr-ban]").forEach(b=>{ b.onclick = ()=>{
    const banned = b.dataset.srBanned==="1", name = b.dataset.srName;
    if(banned){ safetyAction("admin_set_ban", { p_user:b.dataset.srBan, p_banned:false, p_reason:null }, `@${name} can use social features again.`); return; }
    const why = prompt(`Ban @${name} from friends, groups and messages? They can still practise.\n\nReason (kept for your records):`);
    if(why===null) return;
    safetyAction("admin_set_ban", { p_user:b.dataset.srBan, p_banned:true, p_reason:why }, `@${name} is banned from social features.`);
  }; });
  document.querySelectorAll("[data-admin-toggle]").forEach(b=>{ b.onclick = ()=>{ const k = b.dataset.adminToggle; admin.expanded[k] = !admin.expanded[k]; render(); }; });
  document.querySelectorAll("[data-admin-act]").forEach(b=>{ b.onclick = ()=>adminAct(b.dataset.ids.split(",").map(Number), b.dataset.adminAct); });
}
</script>

<script>

// ======================= SUBJECTS =======================
// HOW TO ADD QUESTIONS
// 1. Open the subject's file in the questions folder (e.g. questions/gcse-maths-higher.json) and find the topic.
// 2. Add question objects to that topic's "questions" list, then change QUESTIONS_VERSION below:
//    { "id": "gcse-h-surds-001", "marks": 3, "prompt": "Simplify $\\sqrt{50}$.", "hints": ["50 = 25 × 2"],
//      "solution": "$\\sqrt{50} = 5\\sqrt{2}$", "year": "2023", "paper": "Edexcel 1MA1 Paper 1H", "calculator": false }
// GCSE questions also need "calculator": true (calculator paper) or "calculator": false (non-calculator paper),
// so the calculator filter can find them. GCSE difficulty: 1 mark = easy, 2-4 = medium, 5-6 = hard.
// GCSE questions should also have "answer" (or "answers" / "parts"), so students type their answer to unlock
// the solution. See "GCSE: TYPED ANSWERS" further down for the format.
// Any question can include a "table"; blank cells become answer boxes on GCSE. See "QUESTION TABLES".
// Rules that protect everyone's saved progress:
//  - Every id must be unique across the WHOLE site and must never change once published.
//    Start ids with the subject's prefix: gcse-h-, gcse-f-, alp-, fm- (A-Level Maths keeps its existing ids).
//  - Never rename a topic once people have practised it (scores are stored by topic name).
//  - Topics with no questions show as "Coming soon", so you can fill them in gradually.
const SUBJECT_KEY = "alevel_maths_subject_v1";
const SUBJECTS = [
  { id:"gcse-maths-foundation", name:"GCSE Maths (Foundation)", group:"GCSE", grades:"gcse-foundation", idPrefix:"gcse-f-" },
  { id:"gcse-maths-higher",     name:"GCSE Maths (Higher)",     group:"GCSE", grades:"gcse-higher",     idPrefix:"gcse-h-" },
  { id:"alevel-maths",          name:"A-Level Maths",           group:"A-Level", grades:"alevel",       idPrefix:"" },
  { id:"alevel-further-maths",  name:"A-Level Further Maths",   group:"A-Level", grades:"alevel",       idPrefix:"fm-" },
  { id:"alevel-physics",        name:"A-Level Physics",         group:"A-Level", grades:"alevel",       idPrefix:"alp-" }
];
// Each subject's questions live in their own file: questions/<subject id>.json
// Change QUESTIONS_VERSION whenever you edit a question file, so browsers fetch the new copy straight away.
const QUESTIONS_VERSION = "8";
const SUBJECT_BANKS = {};
const bankLoads = {}, bankErrors = {};
function bankLoaded(sid){ return !!SUBJECT_BANKS[sid]; }
function loadSubject(sid){
  if(SUBJECT_BANKS[sid]) return Promise.resolve(SUBJECT_BANKS[sid]);
  if(bankLoads[sid]) return bankLoads[sid];
  const url = `questions/${sid}.json?v=${QUESTIONS_VERSION}`;
  bankLoads[sid] = fetch(url).catch(()=>fetch(url, {cache:"force-cache"}))
    .then(r=>{ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(data=>{
      const topics = Array.isArray(data) ? data : (data.topics || []);
      topics.forEach(t=>{ t.questions = t.questions || []; t.questions.forEach(q=>{ q.subject = sid; }); });
      SUBJECT_BANKS[sid] = topics; delete bankErrors[sid]; delete bankLoads[sid];
      return topics;
    })
    .catch(e=>{ bankErrors[sid] = location.protocol==="file:" ? "file" : "network"; delete bankLoads[sid]; throw e; });
  return bankLoads[sid];
}
function loadAllSubjects(){ return Promise.allSettled(SUBJECTS.map(s=>loadSubject(s.id))); }
function subjectOf(x){ return (x && x.subject) || "alevel-maths"; }
function currentSubject(){
  let s = null; try{ s = localStorage.getItem(SUBJECT_KEY); }catch(e){}
  return SUBJECTS.some(x=>x.id===s) ? s : "alevel-maths";
}
function subjectInfo(id){ const sid = id || currentSubject(); return SUBJECTS.find(s=>s.id===sid) || SUBJECTS[2]; }
// A-Level Maths keeps plain topic names (so existing progress is untouched); other subjects are namespaced.
function topicKey(subject, topic){ subject = subject || "alevel-maths"; return subject==="alevel-maths" ? topic : subject + "|" + topic; }
function subjectPickerHtml(){
  const cur = currentSubject();
  const groups = [...new Set(SUBJECTS.map(s=>s.group))];
  return `<select id="subjectSelect" class="subject-select" aria-label="Subject">${groups.map(g=>`<optgroup label="${g}">${
    SUBJECTS.filter(s=>s.group===g).map(s=>`<option value="${s.id}" ${s.id===cur?"selected":""}>${esc(s.name)}</option>`).join("")}</optgroup>`).join("")}</select>`;
}

// ======================= HOME PAGE =======================
const SITE_NAME = "Revision Practice";
function subjectSummary(sid){
  let n = 0, pm = 0, ep = 0, last = 0;
  loadAttempts().forEach(a=>{
    if(subjectOf(a)!==sid) return;
    const m = a.marks||1; n++; pm += m; ep += ratingDelta(a.rating, a.hints, m); last = Math.max(last, a.ts||0);
  });
  return { count:n, pct: pm>0 ? Math.max(0, Math.round(ep/pm*100)) : null, last };
}
function ago(ts){
  const d = Math.floor((Date.now()-ts)/DAY_MS);
  return d<=0 ? "today" : d===1 ? "yesterday" : d<7 ? `${d} days ago` : d<14 ? "last week" : `${Math.floor(d/7)} weeks ago`;
}
function renderHome(){
  const name = user && user.username ? user.username : "";
  const attempts = loadAttempts();
  const lastA = attempts.reduce((b,a)=>(!b || (a.ts||0)>(b.ts||0)) ? a : b, null);
  const lastSid = lastA ? subjectOf(lastA) : null;
  const cont = lastSid ? `<div class="card home-continue">
      <div class="qlist-topic">Pick up where you left off</div>
      <div class="home-continue-name">${esc(subjectInfo(lastSid).name)}</div>
      <div class="sub" style="margin:2px 0 12px;">Last practised ${ago(lastA.ts)}</div>
      <button class="btn-primary" data-open-subject="${lastSid}">Continue</button>
    </div>` : `<div class="card home-continue">
      <div class="home-continue-name">Where do you want to start?</div>
      <div class="sub" style="margin:4px 0 0;">Pick a subject below. You'll earn a coin for every whole mark you score, to spend on colour themes in the shop.</div>
    </div>`;
  const groups = [...new Set(SUBJECTS.map(s=>s.group))].map(g=>{
    const cards = SUBJECTS.filter(s=>s.group===g).map(s=>{
      const sm = subjectSummary(s.id);
      const detail = sm.count ? `${sm.count} question${sm.count===1?"":"s"} answered` : "Not started yet";
      return `<button class="subject-card" data-open-subject="${s.id}">
        <span class="subject-card-text"><span class="subject-card-name">${esc(s.name)}</span><span class="subject-card-detail">${detail}</span></span>
        ${sm.count ? gradeBadge(sm.pct, true, s.id) : `<span class="subject-card-go" aria-hidden="true">›</span>`}
      </button>`;
    }).join("");
    return `<h3>${esc(g)}</h3><div class="subject-grid">${cards}</div>`;
  }).join("");
  return `
    <div class="subject-bar"><div class="home-hello">${name ? `Hi, ${esc(name)}` : "Welcome"}</div>${coinPillHtml()}</div>
    <div class="toprow"><h1>Your revision</h1>
      <div class="toprow-links">${themeSwitchHtml()}${isAdmin ? `<button class="nav-link" id="adminBtn">Admin${adminOpenCount ? ` (${adminOpenCount})` : ""}</button>` : ""}</div></div>
    ${cont}
    ${groups}
    ${sponsorHtml()}
    ${supportLineHtml()}`;
}
function attachHomeHandlers(){
  document.querySelectorAll("[data-open-subject]").forEach(b=>{ b.onclick = ()=>{ switchSubject(b.dataset.openSubject); window.scrollTo(0,0); }; });
  const hb = document.getElementById("homeBtn");
  if(hb) hb.onclick = ()=>{ state.screen = "home"; state.editForm = null; document.title = SITE_NAME; render(); window.scrollTo(0,0); };
}

// ======================= FRIENDS & GROUPS =======================
// Everything here goes through database functions in social-and-coins-setup.sql.
// Only usernames are ever sent to other users; email addresses never leave the server.
const social = {
  tab:"friends", query:"", results:null, searching:false, friends:[], invites:[], groups:[], loaded:false, error:"",
  group:null, gtab:"chat", messages:[], members:[], shares:[], board:[], draft:"", busy:false
};
let socialSearchTimer = null, chatPoll = null;

async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args||{});
  if(error) throw error;
  return data;
}
function socialErr(e){
  const t = String(e && e.message || e || "");
  if(/function .* does not exist|could not find the function/i.test(t)) return "Friends and groups aren't set up on the server yet. Run social-and-coins-setup.sql in Supabase.";
  if(/failed to fetch|network/i.test(t)) return "Couldn't connect. Check your internet connection.";
  return t.replace(/^.*?exception:\s*/i, "") || "Something went wrong. Try again.";
}
function socialToast(msg){
  state.toast = { message:msg, showUndo:false };
  render();
  setTimeout(()=>{ if(state.toast && state.toast.message===msg){ state.toast = null; render(); } }, 2800);
}
async function loadSocial(){
  if(!user) return;
  try{
    const [friends, invites, groups] = await Promise.all([rpc("my_friends"), rpc("my_group_invites"), rpc("my_groups")]);
    social.friends = friends||[]; social.invites = invites||[]; social.groups = groups||[]; social.error = "";
  }catch(e){ social.error = socialErr(e); }
  social.loaded = true;
  if(state.screen==="friends" || state.screen==="shareDeck") render(); else updateTabBar();
}
async function runSearch(){
  const q = social.query.trim();
  if(q.length<3){ social.results = null; updateSearchResults(); return; }
  social.searching = true; updateSearchResults();
  try{ const r = await rpc("search_users", { p_query:q }); if(social.query.trim()===q) social.results = r||[]; }
  catch(e){ social.results = []; social.error = socialErr(e); }
  social.searching = false; updateSearchResults();
}
function relationButton(u){
  const id = esc(u.user_id);
  if(u.relation==="friend") return `<span class="pill">Friends ✓</span>`;
  if(u.relation==="outgoing") return `<button class="icon-btn" data-friend-remove="${id}">Cancel request</button>`;
  if(u.relation==="incoming") return `<button class="icon-btn accent" data-friend-accept="${id}">Accept</button>`;
  return `<button class="icon-btn accent" data-friend-add="${id}">Add friend</button>`;
}
function searchResultsHtml(){
  if(social.query.trim().length<3) return `<div class="sub" style="margin:6px 0 0;">Type your friend's full username. For privacy, people only show up when you type their exact username.</div>`;
  if(social.searching && !social.results) return `<div class="sub" style="margin:6px 0 0;">Searching…</div>`;
  if(!social.results || !social.results.length) return `<div class="sub" style="margin:6px 0 0;">No one has the username “${esc(social.query.trim())}”. Check the spelling with your friend.</div>`;
  return social.results.map(u=>`<div class="qlist-row"><div class="social-name">@${esc(u.username)}</div><div class="qlist-actions">${relationButton(u)}</div></div>`).join("");
}
function updateSearchResults(){
  const el = document.getElementById("friendResults");
  if(el){ el.innerHTML = searchResultsHtml(); attachSocialButtons(el); }
}
function renderFriendsPage(){
  const tabs = `<div class="auth-tabs"><button type="button" data-social-tab="friends" class="${social.tab==="friends"?"on":""}">Friends</button><button type="button" data-social-tab="groups" class="${social.tab==="groups"?"on":""}">Groups${social.invites.length?` (${social.invites.length})`:""}</button></div>`;
  const head = `<div class="toprow"><h2>Friends &amp; groups</h2><button class="link-btn" id="backSelectBtn">Back</button></div>`;
  if(!user) return `${head}<div class="card"><div class="sub" style="margin:0 0 12px;">Log in to add friends, join groups and compare scores.</div><button class="btn-primary" id="shopLoginBtn">Log in or create account</button></div>`;
  const err = social.error ? `<div class="auth-msg err">${esc(social.error)}</div>` : "";
  if(!social.loaded) return `${head}${tabs}<div class="sub">Loading…</div>`;
  if(social.tab==="friends"){
    const incoming = social.friends.filter(f=>f.status==="incoming"), outgoing = social.friends.filter(f=>f.status==="outgoing"), friends = social.friends.filter(f=>f.status==="friend");
    const row = (f, actions)=>`<div class="qlist-row"><div class="social-name">@${esc(f.username||"unknown")}</div><div class="qlist-actions">${actions}</div></div>`;
    return `${head}${tabs}${err}
      <div class="card">
        <label class="field" for="friendSearch" style="margin-top:0;">Add a friend by their username</label>
        <input type="text" id="friendSearch" placeholder="Their exact username" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(social.query)}">
        <div id="friendResults">${searchResultsHtml()}</div>
      </div>
      ${incoming.length ? `<div class="card"><h2 style="font-size:1rem;">Friend requests</h2>${incoming.map(f=>row(f, `<button class="icon-btn accent" data-friend-accept="${esc(f.user_id)}">Accept</button><button class="icon-btn" data-friend-decline="${esc(f.user_id)}">Decline</button><button class="icon-btn" data-block-user="${esc(f.user_id)}" data-block-name="${esc(f.username||"")}">Block</button>`)).join("")}</div>` : ""}
      <div class="card"><h2 style="font-size:1rem;">Your friends (${friends.length})</h2>

// ---------- a single group ----------
function openGroup(id){
  const g = social.groups.find(x=>x.id===id); if(!g) return;
  social.group = g; social.gtab = "leaderboard"; social.messages = []; social.members = []; social.shares = []; social.board = []; social.draft = "";
  state.screen = "group"; render(); window.scrollTo(0,0);
  loadGroupTab();
  rpc("group_member_list", { p_group:id }).then(m=>{ social.members = m||[]; if(state.screen==="group" && social.gtab==="members") render(); }).catch(()=>{});
}
async function loadGroupTab(){
  const g = social.group; if(!g) return;
  try{
    if(social.gtab==="chat"){ await fetchMessages(true); }
    else if(social.gtab==="leaderboard"){ social.board = await rpc("group_leaderboard", { p_group:g.id }) || []; }
    else if(social.gtab==="shared"){ social.shares = await rpc("get_shares", { p_group:g.id }) || []; }
    else if(social.gtab==="members"){ social.members = await rpc("group_member_list", { p_group:g.id }) || []; if(!social.loaded) await loadSocial(); }
    social.error = "";
  }catch(e){ social.error = socialErr(e); }
  if(state.screen==="group" && social.gtab!=="chat") render();
}
async function fetchMessages(full){
  const g = social.group; if(!g) return;
  const last = social.messages.length ? social.messages[social.messages.length-1].id : null;
  const rows = await rpc("get_messages", { p_group:g.id, p_after: full ? null : last });
  if(full) social.messages = rows||[];
  else if(rows && rows.length){ const seen = new Set(social.messages.map(m=>m.id)); social.messages.push(...rows.filter(m=>!seen.has(m.id))); }
  else return;
  updateChatList(true);
}
function fmtWhen(ts){
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
  return d.toDateString()===now.toDateString() ? time : d.toLocaleDateString("en-GB", {day:"numeric", month:"short"}) + " " + time;
}
function chatListHtml(){
  if(!social.messages.length) return `<div class="sub" style="text-align:center;margin:20px 0;">No messages yet. Say hello!</div>`;
  const ownerMe = social.group && social.group.role==="owner";
  return social.messages.map(m=>{
    const mine = user && m.user_id===user.id;
    return `<div class="chat-msg${mine?" mine":""}">
      <div class="chat-meta">${mine ? "You" : "@"+esc(m.username||"deleted user")} · ${fmtWhen(m.created_at)}${mine||ownerMe ? ` <button class="chat-del" data-msg-del="${m.id}" aria-label="Delete message">Delete</button>` : ""}${mine ? "" : ` <button class="chat-del" data-report-kind="group_message" data-report-target="${m.id}" data-report-label="a message from @${esc(m.username||"someone")}">Report</button>`}</div>
      <div class="chat-body">${esc(m.body)}</div>
    </div>`;
  }).join("");
}
function updateChatList(scroll){
  const el = document.getElementById("chatList"); if(!el) return;
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  el.innerHTML = chatListHtml();
  el.querySelectorAll("[data-msg-del]").forEach(b=>{ b.onclick = ()=>deleteMessage(Number(b.dataset.msgDel)); });
  if(scroll || nearBottom) el.scrollTop = el.scrollHeight;
}
async function sendMessage(){
  const box = document.getElementById("chatInput"); if(!box) return;
  const body = box.value.trim(); if(!body || social.busy) return;
  social.busy = true;
  try{ await rpc("post_message", { p_group:social.group.id, p_body:body }); box.value = ""; social.draft = ""; await fetchMessages(false); updateChatList(true); }
  catch(e){ socialToast(socialErr(e)); }
  social.busy = false;
  const b2 = document.getElementById("chatInput"); if(b2) b2.focus();
}
async function deleteMessage(id){
  if(!confirm("Delete this message?")) return;
  try{ await rpc("delete_message", { p_id:id }); social.messages = social.messages.filter(m=>m.id!==id); updateChatList(false); }
  catch(e){ socialToast(socialErr(e)); }
}
function startChatPolling(){
  if(chatPoll) return;   // keep one steady timer; re-rendering must not restart it
  chatPoll = setInterval(()=>{
    if(state.screen!=="group" || social.gtab!=="chat" || document.visibilityState!=="visible"){ return; }
    fetchMessages(false).catch(()=>{});
  }, 5000);
}
function stopChatPolling(){ if(chatPoll){ clearInterval(chatPoll); chatPoll = null; } }

// Sharing: decks carry the ids of built-in questions plus full copies of any questions the sharer wrote.
function customQuestionIndex(){
  const idx = {};
  loadCustom().forEach(t=>(t.questions||[]).forEach(q=>{ idx[q.id] = {subject:subjectOf(t), topic:t.topic, category:t.category, question:q}; }));
  return idx;
}
function importCustom(items){
  const custom = loadCustom(), have = new Set(); let added = 0;
  custom.forEach(t=>(t.questions||[]).forEach(q=>have.add(q.id)));
  (items||[]).forEach(it=>{
    if(!it || !it.question || !it.question.id || have.has(it.question.id)) return;
    const sid = SUBJECTS.some(s=>s.id===it.subject) ? it.subject : "alevel-maths";
    let e = custom.find(t=>t.topic===it.topic && subjectOf(t)===sid);
    if(!e){ e = {topic:String(it.topic||"Shared questions"), category:String(it.category||"Shared"), subject:sid, questions:[]}; custom.push(e); }
    const q = it.question;
    e.questions.push({ id:String(q.id), prompt:String(q.prompt||""), solution:String(q.solution||""), hints:Array.isArray(q.hints)?q.hints.map(String):[], marks:Math.max(1, parseInt(q.marks)||1),
      year:String(q.year||""), paper:String(q.paper||""), link:"", subtopic:String(q.subtopic||""), ...(typeof q.calculator==="boolean" ? {calculator:q.calculator} : {}), ...(Array.isArray(q.answers) ? {answers:q.answers.map(String).slice(0,20)} : q.answer!==undefined ? {answers:[String(q.answer)]} : {}), ...(q.exact ? {exact:true} : {}), ...(Array.isArray(q.roots) ? {roots:q.roots.map(String).slice(0,10), variable:String(q.variable||"x").slice(0,3)} : {}), ...(q.table ? {table:tableToText(q.table).slice(0,5000)} : {}), ...(Array.isArray(q.parts) ? {parts:q.parts.slice(0,10).map(pp=>({label:String(pp.label||""), answers:acceptedList(pp).slice(0,20), ...(pp.exact?{exact:true}:{})}))} : {}), ...(q.diagram && q.diagram.image && /^data:image\//.test(q.diagram.image) ? {diagram:{image:q.diagram.image, caption:String(q.diagram.caption||""), alt:String(q.diagram.alt||"Diagram")}} : {}) });
    have.add(q.id); added++;
  });
  if(added) saveCustom(custom);
  return added;
}
async function shareDeck(){
  const sel = document.getElementById("shareDeckSelect"); if(!sel || !sel.value) return;
  const d = loadDecks().find(x=>x.id===sel.value); if(!d) return;
  const idx = customQuestionIndex();
  const payload = { name:d.name, questionIds:d.questionIds.slice(0,500), custom:d.questionIds.filter(id=>idx[id]).map(id=>idx[id]) };
  try{ await rpc("share_to_group", { p_group:social.group.id, p_kind:"deck", p_title:d.name, p_payload:payload }); socialToast("Deck shared."); social.gtab = "shared"; loadGroupTab(); }
  catch(e){ socialToast(/pg_column_size|check constraint/i.test(e.message||"") ? "That deck is too big to share (its pictures take up too much space)." : socialErr(e)); }
}
async function shareQuestion(){
  const sel = document.getElementById("shareQSelect"); if(!sel || !sel.value) return;
  const it = customQuestionIndex()[sel.value]; if(!it) return;
  try{ await rpc("share_to_group", { p_group:social.group.id, p_kind:"question", p_title:snipPlain(it.question.prompt, 80), p_payload:it }); socialToast("Question shared."); loadGroupTab(); }
  catch(e){ socialToast(/pg_column_size|check constraint/i.test(e.message||"") ? "That question's picture is too big to share." : socialErr(e)); }
}
function snipPlain(s, n){ const t = String(s||"").replace(/\$+/g,"").replace(/\s+/g," ").trim(); return t.length>n ? t.slice(0,n)+"…" : (t||"Question"); }
function saveShare(id){
  const sh = social.shares.find(x=>x.id===id); if(!sh) return;
  const p = sh.payload || {};
  if(sh.kind==="deck"){
    const added = importCustom(p.custom);
    const decks = loadDecks();
    decks.push({ id:"deck"+Date.now()+Math.random().toString(36).slice(2,6), name:String(p.name||sh.title).slice(0,60), questionIds:(p.questionIds||[]).map(String) });
    saveDecksL(decks);
    socialToast(`Saved “${sh.title}” to your decks${added?` (plus ${added} new question${added===1?"":"s"})`:""}.`);
  }else{
    const added = importCustom([p]);
    socialToast(added ? "Question added to your questions (see Manage)." : "You already have this question.");
  }
}
async function deleteShare(id){
  if(!confirm("Remove this from the group?")) return;
  try{ await rpc("delete_share", { p_id:id }); social.shares = social.shares.filter(s=>s.id!==id); render(); }
  catch(e){ socialToast(socialErr(e)); }
}
